<section>
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="card-header bg-blue">
            <div class="row w-100">
              <div class="col-sm-12 col-md-6 col-lg-6">
                <h4>Recent Photograph</h4>
              </div>
            </div>
          </div>

          <div class="card-body mt-2">
            <!-- ====================== VIEW MODE ====================== -->
            <div *ngIf="isViewMode && photoData">
              <div class="row">
                <div class="col-md-4" *ngIf="photoData.photo">
                  <label class="fw-semibold">Uploaded Photograph</label><br />
                  <img
                    [src]="photoData.photo"
                    alt="Recent Photograph"
                    class="img-thumbnail my-2"
                    style="
                      width: 200px;
                      height: 240px;
                      object-fit: cover;
                      border-radius: 8px;
                    "
                  />
                </div>

                <div class="col-12 mt-3">
                  <button type="button" class="btn btn-warning" (click)="editPhoto()">
                    <i class="fas fa-edit me-1"></i> Re-upload Photograph
                  </button>
                </div>
              </div>
            </div>

            <!-- ====================== FORM MODE ====================== -->
            <form *ngIf="!isViewMode" [formGroup]="photoForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-sm-12 col-md-8 col-lg-6">
                  <label>
                    Upload Recent Photograph
                    <span class="text-danger" *ngIf="!photoData?.photo">*</span>
                  </label>
                  <div class="input-group">
                    <input
                      type="file"
                      class="form-control"
                      (change)="onFileSelected($event)"
                      accept="image/jpeg,image/png,image/jpg"
                    />
                  </div>
                  <small class="text-muted">Allowed: JPG, PNG (Max 5MB). Please upload a recent passport-style colour photo.</small>
                  <div
                    *ngIf="submitted && validate['PhotoFile'].errors && !photoData?.photo"
                    class="text-danger mt-1 small"
                  >
                    Please upload your recent photograph.
                  </div>

                  <!-- Image Preview -->
                  <div *ngIf="previewPhoto" class="mt-3">
                    <label class="d-block small text-muted mb-1">Preview:</label>
                    <img
                      [src]="previewPhoto"
                      alt="Photo Preview"
                      class="img-thumbnail"
                      style="width: 180px; height: 220px; object-fit: cover; border-radius: 8px;"
                    />
                  </div>
                </div>
              </div>

              <!-- Submit Buttons -->
              <div class="row mt-4">
                <div class="col-12">
                  <button type="submit" class="btn btn-primary me-2">
                    <i class="fas fa-save me-1"></i> Save & Continue
                  </button>
                  <button type="button" class="btn btn-secondary" (click)="reset()">
                    Reset
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
