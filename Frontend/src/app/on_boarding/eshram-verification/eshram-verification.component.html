<section>
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="card-header bg-blue">
            <div class="row w-100">
              <div class="col-sm-12 col-md-6 col-lg-6">
                <h4>E-Shram Card Verification</h4>
              </div>
            </div>
          </div>

          <div class="card-body mt-2">
            <!-- ====================== VIEW MODE ====================== -->
            <div *ngIf="isViewMode && eshramData">
              <div class="row">
                <div class="col-md-4">
                  <label class="text-muted">UAN:</label>
                  <p class="fs-5">
                    <strong>{{ eshramData.eshram_UAN }}</strong>
                  </p>
                </div>

                <div class="col-md-6" *ngIf="eshramData.eshram_Photo_url">
                  <label class="fw-semibold">E-Shram Card Document / Photo</label><br />
                  <img
                    [src]="eshramData.eshram_Photo_url"
                    alt="E-Shram Card"
                    class="img-thumbnail my-2"
                    style="
                      max-width: 320px;
                      max-height: 200px;
                      object-fit: contain;
                      cursor: pointer;
                    "
                  />
                </div>

                <div class="col-12 mt-3">
                  <button type="button" class="btn btn-warning" (click)="editEshram()">
                    <i class="fas fa-edit me-1"></i> Edit E-Shram Card
                  </button>
                </div>
              </div>
            </div>

            <!-- ====================== FORM MODE ====================== -->
            <form *ngIf="!isViewMode" [formGroup]="eshramForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <!-- UAN -->
                <div class="col-sm-12 col-md-6 col-lg-4">
                  <label>UAN <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-id-card"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control text-uppercase"
                      formControlName="eshram_UAN"
                      placeholder="Enter UAN Number"
                      maxlength="30"
                      (blur)="checkEshramDuplicate()"
                    />
                  </div>
                  <div
                    *ngIf="(submitted || validate['eshram_UAN'].touched) && validate['eshram_UAN'].errors"
                    class="text-danger mt-1 small"
                  >
                    <div *ngIf="validate['eshram_UAN'].errors['required']">
                      UAN is required.
                    </div>
                    <div *ngIf="validate['eshram_UAN'].errors['pattern']">
                      Please enter a valid UAN.
                    </div>
                    <div *ngIf="validate['eshram_UAN'].errors['duplicate']">
                      {{ validate['eshram_UAN'].errors['duplicate'] }}
                    </div>
                  </div>
                </div>

                <!-- E-Shram Photo Upload -->
                <div class="col-sm-12 col-md-6 col-lg-5">
                  <label>
                    Upload E-Shram Card Photo
                    <span class="text-danger" *ngIf="!eshramData?.eshram_Photo">*</span>
                  </label>
                  <div class="input-group">
                    <input
                      type="file"
                      class="form-control"
                      (change)="onFileSelected($event, 'eshramPhotoFile')"
                      accept="image/jpeg,image/png,image/jpg,application/pdf"
                    />
                  </div>
                  <small class="text-muted">Allowed: JPG, PNG, PDF (Max 5MB)</small>
                  <div
                    *ngIf="submitted && validate['eshramPhotoFile'].errors && !eshramData?.eshram_Photo"
                    class="text-danger mt-1 small"
                  >
                    Please upload E-Shram card photo.
                  </div>

                  <!-- Image Preview -->
                  <div *ngIf="previewImage" class="mt-2">
                    <img
                      [src]="previewImage"
                      alt="E-Shram Preview"
                      class="img-thumbnail"
                      style="max-width: 250px; max-height: 160px; object-fit: contain;"
                    />
                  </div>
                </div>
              </div>

              <!-- Submit Buttons -->
              <div class="row mt-4">
                <div class="col-12">
                  <button type="submit" class="btn btn-primary me-2">
                    <i class="fas fa-save me-1"></i> Save & Continue
                  </button>
                  <button type="button" class="btn btn-secondary" (click)="reset()">
                    Reset
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
