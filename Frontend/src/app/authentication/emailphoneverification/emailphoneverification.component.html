<section *ngIf="true">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-6 p-4">
        <div class="card">
          <div class="card-header text-center">
            <h6>Create New Password</h6>
          </div>
          <br>
          <div class="card-body">
            <p class="text-center">Enter a new password below.</p>
            <form (ngSubmit)="reset_password_token()">
              <div class="form-group position-relative">
                <input
                  class="form-control input-lg"
                  [(ngModel)]="newPassword"
                  name="newPassword"
                  [type]="showNewPassword ? 'text' : 'password'"
                  placeholder="New Password"
                  required
                />
                
                <span
                  class="input-group-text p-3 me-0 password-toggle position-absolute"
                  style="right:0px; top: 50%; transform: translateY(-50%); cursor: pointer;"
                  (click)="toggleNewPasswordVisibility()"
                >
                  <i [class]="showNewPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
                </span>
              </div>
              <div class="form-group position-relative mt-3">
                <input
                  class="form-control input-lg"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  placeholder="Confirm Password"
                  required
                />
                
                <span
                  class="input-group-text p-3 password-toggle position-absolute"
                  style="right: 0px; top: 50%; transform: translateY(-50%); cursor: pointer;"
                  (click)="toggleConfirmPasswordVisibility()"
                >
                  <i [class]="showConfirmPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
                </span>
              </div>
              <button type="submit" class="btn btn-primary btn-block mt-3 mb-3">
                Reset Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
