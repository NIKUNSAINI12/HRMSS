<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          

            <form [formGroup]="Confirmationattributemasterform">
                <!-- NextFrom---------- -->
                <div class="card-header bg-blue mt-3 ">
                    <div class="row w-100 ">
                        <div class="col-sm-12 col-md-6 col-lg-6 ">
                            <h4>Confirmation Attribute Master</h4>
                        </div>
                        <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/hr/hrdashboard/Confirmation-Attribute-Master-list">Back
            </button>
        </div>

                    </div>


                </div>
                <!-- Clearence depratment -->
                <div class="card-body mt-4">
                    <div class="row">
                        <div class="col-md-3">
                            <label>Category</label>
                            <div class="form-group">
                                <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                                    formControlName="Category" placeholder="--Select --" class="w-100"></ng-select>
                                <div *ngIf="submitted   && Confirmationattributemasterform.get('Category')?.invalid"
                                    class="text-danger">
                                    Category is required!
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Is Active</label>&nbsp;&nbsp;
                                <input type="checkbox" class="form-check-input fs-6 mx-1" formControlName="IsActive">

                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>Description</label>
                            <div class="form-group">
                                <input type="text" class="form-control" formControlName="Description">

                                    <div *ngIf="submitted   && Confirmationattributemasterform.get('Description')?.invalid"
                                    class="text-danger">
                                    Description is required!
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>Display Order</label>
                            <div class="form-group">
                                <input type="number" class="form-control" formControlName="DisplayOrder">
                                <div *ngIf="submitted   && Confirmationattributemasterform.get('DisplayOrder')?.invalid"
                                class="text-danger">
                                Display Order is required!
                            </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label>Remarks</label>
                            <div class="form-group">
                                <input type="textarea" class="form-control" formControlName="Remarks">
                                <div *ngIf="submitted   && Confirmationattributemasterform.get('Remarks')?.invalid"
                                class="text-danger">
                                Remarks is required!
                            </div>
                            </div>
                        </div>
                    </div>
                

                </div>

                <!-- parameter department -->

                <!-- NextFrom---------- -->
                <div class="card-header bg-blue mt-3 ">
                    <div class="row w-100 ">
                        <div class="col-sm-12 col-md-6 col-lg-6 ">
                            <h4>Assesment Details</h4>
                        </div>
                        <!-- <div
                            class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
                            <button class="btn btnheader" routerLink="/dash/hr/hrdashboard/Due_Clearence_list">Back
                            </button>
                        </div> -->

                    </div>


                </div>
                <div class="card-body mt-4">
                    <div class="row">
                        <div class="col-md-4">
                            <label>Assesment</label>
                            <div class="form-group">
                                <input type="text" class="form-control" formControlName="Assesment">

                            </div>
                            <div class="form-group">
                                <label>Is Active</label>&nbsp;&nbsp;
                                <input type="checkbox" class="form-check-input fs-6 mx-1" formControlName="IsActivess">

                            </div>
                        </div>
                        <div class="col-md-4">
                            <label>Score</label>
                            <div class="form-group">
                                <input type="number" class="form-control" formControlName="Score">
                               
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label>Display Order</label>
                            <div class="form-group">
                                <input type="number" class="form-control" formControlName="DisplayOrders">
                               
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary mx-1" (click)="submit()">Add</button>
                    </div>
                  
                    <!-- list  -->

                    <div class="card-header">
                        <div class="row w-100">
                          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
                            <h4>Assesment Details</h4>
                           
                          </div>
                       
                      
                          
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive table-invoice">
                            <table class="table table-bordered">
                                <thead>
                                  <tr>
                                    <th>Sr.</th>
                                    <th>Assesment</th>
                                    <th>Score</th>
                                    <th>Order No.</th>  
                                    <th>Active</th>               
                                    <th>Action</th>
                                    
                                  </tr>
                                </thead>
                                <tbody>
                                  <tr *ngFor="let item of ConfirmationattributemasterList; let i = index">
                                    <td>{{ i + 1 }}</td>
                                    <td> {{item.Assesment}}</td>
                                    <td>{{item.Score}}</td>
                                    <td> {{item.OrderNo}}</td>
                                    <td> {{item.Active}}</td>
                             
                                    <td>
                                      
                                       <button class="btn btn-sm btn-outline" (click)="delete(item.id)"><i class="fa fa-trash" style="color:#3080e8; font-size: 14px;"></i></button>
                                      </td>
                                  </tr> 
                                </tbody>
                              </table>
                    
                            
                          </div>
                    </div>

                    <!-- Buttons -->
                    <div class="modal-footer">

                        <button type="submit" class="btn btn-outline-dark mx-1" (click)="resetForm()">Reset</button>
                        <button type="submit" class="btn btn-primary mx-1" (click)="submit()">submit</button>


                    </div>
                </div>
            </form>
        </div>


    </div>

</div>
