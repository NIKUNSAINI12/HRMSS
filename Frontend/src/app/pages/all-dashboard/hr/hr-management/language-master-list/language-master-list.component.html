<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <div class="row w-100">

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
            <h4>Office Type Master List</h4>
          </div>

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
            <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
          </div>

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/hr/hrdashboard/LanguageMaster">
              Add
            </button>
            <button class="btn btnheader mx-1" (click)="exportToExcel()">
              Download
            </button>
          </div>


        </div>
      </div>

      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-responsive">
            <thead>
              <tr>
                <th>Sr.</th>

                <th>Description</th>
                <th>Action</th>

              </tr>
            </thead>
            <tbody>
              <tr
                *ngFor="let item of filteredData() 
                          | paginate : { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems: totalItems };let i = index">
                <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                <td>{{ item.description}}</td>

                <td>
                  <button class="btn btn-sm btn-outline px-1 mx-1"><i
                      class="fa-regular fa-pen-to-square  fw-semibold" (click)="isUpdate(item.pk_langid) "></i></button>
                  <button class="btn btn-sm btn-outline px-1 mx-1" (click)="deleteLanguageMaster(item.pk_langid)"><i
                      class="fa fa-trash text-dark"></i></button>
                </td>


              </tr>


            </tbody>
          </table>


          <!-- Pagination controls -->
          <pagination-controls (pageChange)="onPageChange($event)" totalItems="totalItems" itemsPerPage="pageSize">
          </pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
