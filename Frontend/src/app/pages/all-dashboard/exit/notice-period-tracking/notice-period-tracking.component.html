<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header bg-blue">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6"><h4>Notice Period Tracking</h4></div>
          <div class="col-sm-12 col-md-6 col-lg-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/exit/exitdashboard/admin_resignation_list">Back</button>
          </div>
        </div>
      </div>
      <div class="card-body mt-4">
        <form [formGroup]="noticeForm" class="row row-cols-1 row-cols-md-3">
          <div class="col"><label>Employee Code</label>
            <div class="form-group"><input type="text" class="form-control" [value]="empInfo.empCode" readonly></div>
          </div>
          <div class="col"><label>Employee Name</label>
            <div class="form-group"><input type="text" class="form-control" [value]="empInfo.empName" readonly></div>
          </div>
          <div class="col"><label>Designation</label>
            <div class="form-group"><input type="text" class="form-control" [value]="empInfo.designation" readonly></div>
          </div>
          <div class="col"><label for="noticeStartDate">Notice Start Date<span style="color:red">*</span></label>
            <div class="form-group">
              <input type="date" id="noticeStartDate" class="form-control" formControlName="noticeStartDate" (change)="calculate()">
              <span *ngIf="submitted && noticeForm.get('noticeStartDate')?.invalid" class="text-danger mt-1" style="font-size:12px;">Required.</span>
            </div>
          </div>
          <div class="col"><label for="lastWorkingDate">Last Working Date<span style="color:red">*</span></label>
            <div class="form-group">
              <input type="date" id="lastWorkingDate" class="form-control" formControlName="lastWorkingDate" (change)="calculate()">
              <span *ngIf="submitted && noticeForm.get('lastWorkingDate')?.invalid" class="text-danger mt-1" style="font-size:12px;">Required.</span>
            </div>
          </div>
          <div class="col"><label>Total Notice Days (Required)</label>
            <div class="form-group"><input type="number" class="form-control" formControlName="requiredNoticeDays"></div>
          </div>
          <div class="col"><label>Actual Served Days (Auto)</label>
            <div class="form-group"><input type="number" class="form-control" formControlName="servedDays" readonly></div>
          </div>
          <div class="col"><label>Buyout Days</label>
            <div class="form-group"><input type="number" class="form-control" formControlName="buyoutDays" (change)="calculate()"></div>
          </div>
          <div class="col"><label>Shortfall Days (Auto)</label>
            <div class="form-group"><input type="number" class="form-control" formControlName="shortfallDays" readonly></div>
          </div>
          <div class="col"><label>Per Day Salary (₹)</label>
            <div class="form-group"><input type="number" class="form-control" formControlName="perDaySalary" (change)="calculate()"></div>
          </div>
          <div class="col"><label>Recovery Amount (₹) (Auto)</label>
            <div class="form-group"><input type="number" class="form-control" formControlName="recoveryAmount" readonly></div>
          </div>
        </form>
        <div class="row">
          <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
            <button type="submit" class="btn btn-primary mx-1" (click)="submitForm()">Save</button>
            <button type="reset" class="btn btn-outline-dark mx-1">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
