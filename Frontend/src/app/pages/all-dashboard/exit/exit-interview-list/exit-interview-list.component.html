<div class="row">
  <div class="col-12">
    <div class="card w-100">

      <div class="card-header py-1 bg-primary">
        <div class="row w-100">
          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
            <h4>Exit Interviews</h4>
          </div>
          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
            <input type="text" class="form-control" placeholder="Search by name, code..." [(ngModel)]="searchText" />
          </div>

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader mx-1" (click)="exportToExcel()">Download</button>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive table-invoice">
          <table id="exportTable" class="table">
            <thead>
              <tr>
                <th>Sr.</th>
                <th>Employee Code</th>
                <th>Employee Name</th>
                <th>Department</th>
                <th>Submission Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of filteredData() 
              | paginate: { itemsPerPage: pageSize, currentPage: pageIndex, totalItems: totalCount }; let i = index">
                <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                <td>{{ item.empCode }}</td>
                <td>{{ item.empName }}</td>
                <td>{{ item.department }}</td>
                <td>{{ item.submittedDate | date:'dd-MM-yyyy' }}</td>
                <td>
                  <button class="btn btn-sm btn-outline" (click)="view(item.id)">
                    <i class="fa fa-eye"></i> View
                  </button>
                </td>
              </tr>
            </tbody>

          </table>

          <pagination-controls (pageChange)="onPageChange($event)">
          </pagination-controls>
        </div>
        <p *ngIf="interviewList.length === 0">No records found.</p>

      </div>
    </div>
  </div>
</div>
