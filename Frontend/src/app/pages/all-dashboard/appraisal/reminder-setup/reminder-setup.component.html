<div class="row">
    <div class="col-12">
        <div class="card">
            <!-- Card Header -->
            <div class="card-header bg-blue">
                <div class="row w-100">
                    <div class="col-12 d-flex align-items-center justify-content-start">
                        <h4 class="text-white">Reminder Setup</h4>
                    </div>
                </div>
            </div>

            <!-- Only the table is inside the form -->
            <div class="mt-4">
                <form [formGroup]="reminderForm" (ngSubmit)="onSubmit()" >
                    <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Alert</th>
                                <th>Message</th>
                                <th class="text-center">Active</th>
                                <th class="text-center">Count</th>
                            </tr>
                        </thead>
                        <tbody formArrayName="reminders">
                            <tr *ngFor="let reminder of reminders.controls; let i = index" [formGroupName]="i">
                                <td class="align-middle text-center">
                                    {{ i + 1 }}

                                </td>
                                <!-- Label Column -->
                                <td class="align-middle">
                                    <label class="form-label m-0"> {{ reminderLabels[i] }}</label>
                                    <!-- Hidden input for LabelMessage (for TS inclusion) -->
                                    <input type="hidden" [value]="reminderLabels[i]" />
                                </td>

                                <!-- Alert Input -->
                                <td class="text-start align-middle">
                                    <input type="text" class="form-control mt-2" formControlName="alert"
                                        placeholder="Enter alert message" />
                                </td>



                                <td class="text-center align-middle">
                                    <div
                                        class="form-check form-switch d-flex justify-content-center align-items-center switch-lg">
                                        <input class="form-check-input" type="checkbox"
                                            [id]="'flexSwitchCheckDefault' + i" formControlName="active" />
                                        <label class="form-check-label"
                                            [for]="'flexSwitchCheckDefault' + i">&nbsp;</label>
                                    </div>
                                </td>






                                <!-- Count Input -->
                                <!-- <td class="text-center align-middle">
                                    <input type="number" class="form-control mt-2 text-center w-25" formControlName="count"
                                        min="0" />
                                </td> -->
                                <td class="text-center align-middle">
                                    <div class="d-flex justify-content-center align-items-center">
                                        <input type="number" class="form-control text-center w-50"
                                            formControlName="count" min="0" />
                                    </div>
                                </td>

                            </tr>
                        </tbody>
                    </table>
                    </div>

                    <div class="d-flex justify-content-end align-items-center me-2 m-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
