<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header bg-primary">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
            <h4 class="">Behavioral Area Master</h4>
          </div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader"
              routerLink="/dash/appraisal/appraisaldashboard/behavioral-area-master_list">Back</button>
          </div>
        </div>
      </div>

      <!-- main header close -->

      <!--  -->

      <div class="card-body mt-4">
        <form [formGroup]="behavioralForm" (ngSubmit)="onSubmit()" class="row row-cols-1 row-cols-md-3 g-4">
          <div class="col">
            <label for="Description">Description :<span style="color: red"></span></label>
            <input maxlength="255"  id="Description" type="text" name="description" class="form-control" formControlName="description" />
            <div *ngIf="behavioralForm.get('description')?.touched && behavioralForm.get('orderBy')?.invalid"
              class="text-danger">
              <small *ngIf="behavioralForm.get('description')?.errors?.['required']">Discription order is required.</small>
             </div>
          </div>

          <div class="col">
            <label for="Weightage">Weightage:</label>
            <input type="text" maxlength="10" id="Weightage" class="form-control" formControlName="weightage" />
            <div *ngIf="behavioralForm.get('weightage')?.touched && behavioralForm.get('weightage')?.invalid"
              class="text-danger">
              <small *ngIf="behavioralForm.get('weightage')?.errors?.['required']">Weightage is required.</small>
              <small *ngIf="behavioralForm.get('weightage')?.errors?.['pattern']">Inavlid input.</small>
            </div>
          </div>

          <div class="col">
            <label for="display">Display Order:<span style="color: red">*</span></label>
            <input type="text" id="display" class="form-control" formControlName="orderBy" />
            <div *ngIf="behavioralForm.get('orderBy')?.touched && behavioralForm.get('orderBy')?.invalid"
              class="text-danger">
              <small *ngIf="behavioralForm.get('orderBy')?.errors?.['required']">Display order is required.</small>
              <small *ngIf="behavioralForm.get('orderBy')?.errors?.['pattern']">Only numeric values allowed.</small>
            </div>
          </div>



          <div class="col">
            <label for="remark" class="">Remark :<span style="color: red"></span></label>
            <textarea maxlength="255" class="form-control" name="" rows="4" id="remark" name="remark"
              formControlName="remark"></textarea>
          </div>

          <div class="col d-flex align-items-center">
            <input type="checkbox" class="form-check-input   ms-1 me-2" id="active" name="isActive"
              formControlName="isActive" />
            <label for="active" class="form-check-label">
              Active<span style="color: red"></span></label>
          </div>
          <!-- Buttons -->
          <div class="modal-footer mt-2">
            <button type="submit" class="btn btn-primary mx-1">{{Isedit ? 'Update' : 'Save'}}</button>
            <button type="reset" class="btn btn-outline-dark mx-1">Reset</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
