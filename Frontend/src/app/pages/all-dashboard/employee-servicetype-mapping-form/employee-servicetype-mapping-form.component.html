<div class="row">
  <div class="col-12">
    <div class="card w-100 shadow-sm border-0">

      <!-- Card Header -->
      <div class="card-header bg-primary py-2 d-flex align-items-center justify-content-between">
        <h4 class="text-white mb-0">{{ isEditMode ? 'Edit Employee Service Type Mapping' : 'Add Employee Service Type Mapping' }}</h4>
        <button class="btn btnheader" type="button" (click)="onCancel()">
          Back
        </button>
      </div>

      <!-- Card Body Form -->
      <div class="card-body p-4">

        <div *ngIf="isLoading" class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <form *ngIf="!isLoading" (ngSubmit)="onSave()" novalidate>
          <div class="row g-3 align-items-end">

            <!-- Service Type -->
            <div class="col-md-4 col-sm-6">
              <label class="form-label fw-semibold">Service Type <span class="text-danger">*</span></label>
              <ng-select [items]="serviceTypes" bindLabel="name" bindValue="value"
                placeholder="--Select Service Type--" [(ngModel)]="formData.serviceType" name="serviceType"
                (ngModelChange)="onServiceTypeChange()" [disabled]="isEditMode" [clearable]="!isEditMode"
                [searchable]="true" required>
              </ng-select>
            </div>

            <!-- ESI Checkbox -->
            <div class="col-md-2 col-sm-3 d-flex align-items-end justify-content-start">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="checkESI" [(ngModel)]="formData.esi" name="esi">
                <label class="form-check-label fw-semibold" for="checkESI">ESI</label>
              </div>
            </div>

            <!-- PF Checkbox -->
            <div class="col-md-2 col-sm-3 d-flex align-items-end justify-content-start">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="checkPF" [(ngModel)]="formData.pf" name="pf">
                <label class="form-check-label fw-semibold" for="checkPF">PF</label>
              </div>
            </div>

            <!-- LWF Checkbox -->
            <div class="col-md-2 col-sm-3 d-flex align-items-end justify-content-start">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="checkLWF" [(ngModel)]="formData.lwf" name="lwf">
                <label class="form-check-label fw-semibold" for="checkLWF">LWF</label>
              </div>
            </div>

            <!-- PT Checkbox -->
            <div class="col-md-2 col-sm-3 d-flex align-items-end justify-content-start">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="checkPT" [(ngModel)]="formData.pt" name="pt">
                <label class="form-check-label fw-semibold" for="checkPT">PT</label>
              </div>
            </div>

            <!-- Action Buttons on Right Side -->
            <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-2">
              <button type="submit" class="btn btn-primary px-4" [disabled]="isSaving">
                <i *ngIf="isSaving" class="fa fa-spinner fa-spin me-1"></i>
                {{ isEditMode ? 'Update' : 'Save' }}
              </button>
              <button type="button" class="btn btn-outline-dark px-4" (click)="onCancel()">
                Back
              </button>
            </div>

          </div>
        </form>

      </div>

    </div>
  </div>
</div>
