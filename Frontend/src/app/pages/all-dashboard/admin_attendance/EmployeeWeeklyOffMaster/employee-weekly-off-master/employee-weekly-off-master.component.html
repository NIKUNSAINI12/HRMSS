<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">

            <!-- main header  -->

            <div class="card-header bg-blue pt-lg-1 pb-lg-1 mt-0">
                <div class="col-sm-12 col-md-12 col-lg-3 col-12">

                    <div class="row w-100">
                        <div class="col-sm-12 col-md-12 col-lg-12 ">
                            <h4 class="">Employee Search</h4>
                        </div>
                    </div>

                </div>

                <div class="col-sm-12 col-md-12 col-lg-7 col-12">
                    <div class="row w-100">
                        <div class="col-sm-12 col-md-12 col-lg-12">
                            <app-common-search (filtersChanged)="handleFilters($event)"></app-common-search>
                        </div>
                    </div>
                </div>

                <div class="col-sm-12 col-md-12 col-lg-2 col-12">
                    <div class="row w-100">
                        <div
                            class="col-sm-12 col-md-12 col-lg-12 d-flex align-items-center justify-content-end ms-auto gap-2">
                            <button class="btn btn-light"
                                routerLink="/dash/adminAttendance/adminAttendancedashboard/EmployeeWeeklyOffMaster_list">
                                Back
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- main header close -->




            <div class="card-body px-0">
                <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">

                    <div class="row mt-2 mb-3 px-2">
                        <div class="col-md-4">
                            <label for="SelectEmployeeType" class="">Employee</label>
                            <ng-select [items]="EmployeeList" id="SelectEmployeeType" bindLabel="name" bindValue="value"
                                formControlName="SelectEmployeeType" placeholder="--Select Employee--" class="w-100"
                                [searchable]="true" (search)="onEmployeeSearch($event)" [loading]="loadingEmployees" loadingText="Searching employees...">
                            </ng-select>
                            <span *ngIf="showError && departmentForm.controls['SelectEmployeeType'].invalid"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please select EmployeeType .
                            </span>
                        </div>
                    </div>


                    <!-- <div class="card-header bg-blue py-1 mt-1 px-3">
                        <div class="row w-100">
                            <div class="col-sm-12 col-md-12 col-lg-12 ">
                                <h4 class="">Week Off Day Details</h4>
                            </div>
                        </div>
                    </div> -->


                    <div class="bg-primary rounded-1 mt-3 page-seperator mx-lg-2">
                        <!-- <p class="p-1 text-white ms-4">{{Isedit? 'Edit Employee Experience details':'Employee Experience details'}}</p> -->
                        <p class="p-1 text-white ms-4">Week Off Day Details</p>

                    </div>

                    <div class="table-responsive mt-3">
                        <table class="table table-bordered">
                            <thead class="bg-secondary text-white">
                                <tr>
                                    <th>S.No</th>
                                    <th>Day / Occurrence</th>
                                    <th *ngFor="let n of [1, 2, 3, 4, 5]">{{ n }}st</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let day of weekDays; let i = index">
                                    <td>{{ i + 1 }}</td>
                                    <td>{{ day }}</td>
                                    <td *ngFor="let n of [0, 1, 2, 3, 4]">
                                        <input type="checkbox" [formControl]="getCheckboxControl(i, n)" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary mx-1">{{ isEditMode ? 'Update' : 'Save' }}
                        </button>
                        <button type="button" class="btn btn-outline-dark mx-1" (click)="resetForm()">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
