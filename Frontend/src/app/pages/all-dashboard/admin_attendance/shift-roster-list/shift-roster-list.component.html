<div class="row">
  <div class="col-12">
    <div class="card">
      <!-- Card Header -->
      <div class="card-header bg-primary">
        <div class="row w-100 align-items-center">
          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
            <h4>List of Shift Roster</h4>
          </div>

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
            <input
              type="text"
              class="form-control"
              placeholder="Search..."
              [(ngModel)]="searchTerm"
              (ngModelChange)="onSearch()"
            />
          </div>

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/adminAttendance/adminAttendancedashboard/shift_roster">
              Add
            </button>
            <button class="btn btnheader mx-1" routerLink="/dash/adminAttendance/adminAttendancedashboard/shift_roster_upload">
              Bulk Upload
            </button>
            <button class="btn btn-light mx-1" (click)="exportToExcel()">
              Download
            </button>
          </div>
        </div>
      </div>

      <!-- Card Body -->
      <div class="card-body">
        <div class="table-responsive table-invoice">
          <table id="exportTable" class="table table-bordered">
            <thead>
              <tr>
                <th>Sr.No.</th>
                <th>Effective From</th>
                <th>Employee Code</th>
                <th>Employee Name</th>
                <th>Shift Name</th>
                <th>Week Off Day</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of list | paginate: { itemsPerPage: pageSize, currentPage: pageIndex, totalItems: totalItems }; let i = index">
                <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                <td>{{ item.effectiveFrom | date: 'dd/MM/yyyy' }}</td>
                <td>{{ item.empCode }}</td>
                <td>{{ item.empName }}</td>
                <td>{{ item.shiftName }}</td>
                <td>{{ item.weekOffDay }}</td>
                <td>
                  <button class="btn btn-sm btn-outline" (click)="editRecord(item)" title="Edit">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button class="btn btn-sm btn-outline" (click)="deleteRecord(item)" title="Delete">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="list.length === 0">
                <td colspan="7" class="text-center text-muted py-3">
                  No records found.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-end mt-2" *ngIf="totalItems > pageSize">
          <pagination-controls (pageChange)="onPageChange($event)"></pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
