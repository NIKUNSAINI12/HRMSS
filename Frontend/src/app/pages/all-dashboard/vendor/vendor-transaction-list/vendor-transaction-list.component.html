<div class="container-fluid pt-2">
  <div class="row">
    <div class="col-12">
      
      <!-- Filter Card -->
      <div class="card mb-3 shadow-sm border-0">
        <div class="card-header bg-primary text-white d-flex align-items-center py-2">
          <h5 class="mb-0 fs-6"><i class="fa fa-filter me-2"></i>Vendor Transaction List Filters</h5>
        </div>
        <div class="card-body">
          <form [formGroup]="filterForm" (ngSubmit)="searchTransactions()" class="row g-2 align-items-end mb-2">
            
            <!-- Select Client -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="form-label">Client <span style="color: red;">*</span></label>
              <ng-select [items]="clientList" bindLabel="name" bindValue="value" appendTo="body" placeholder="Select Client" formControlName="client">
              </ng-select>
            </div>

            <!-- Select Model -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="form-label">Model <span style="color: red;">*</span></label>
              <ng-select [items]="modelList" bindLabel="name" bindValue="value" appendTo="body" placeholder="Select Model" formControlName="model">
              </ng-select>
            </div>

            <!-- Select Location -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="form-label">Location</label>
              <ng-select [items]="locationList" bindLabel="name" bindValue="value" appendTo="body" placeholder="Optional" formControlName="location">
              </ng-select>
            </div>

            <!-- Select Transaction Range -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="form-label">Transaction Range</label>
              <ng-select [items]="transactionRanges" bindLabel="name" bindValue="value" appendTo="body" placeholder="Optional" formControlName="transactionRange">
              </ng-select>
            </div>

            <!-- Select Vendor Code (Autocomplete) -->
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
              <label class="form-label">Vendor</label>
              <ng-select [items]="vendorCodes$ | async" bindLabel="VendorName" bindValue="VendorCode" appendTo="body" placeholder="Type 3 chars to search..." formControlName="vendorCode" [typeahead]="vendorCodeInput$" [loading]="isVendorsLoading">
                <ng-template ng-option-tmp let-item="item">
                  {{item.VendorCode}} - {{item.VendorName}}
                </ng-template>
                <ng-template ng-label-tmp let-item="item">
                  {{item.VendorCode}} - {{item.VendorName}}
                </ng-template>
              </ng-select>
            </div>

            <div class="col-12 col-sm-6 col-md-12 col-lg-2 d-flex gap-2">
              <button type="submit" class="btn btn-primary w-100"><i class="fa fa-search me-1"></i> Search</button>
              <button type="button" class="btn btn-outline-secondary w-100" (click)="resetForm()">Reset</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Data Table Card -->
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center py-2">
          <h5 class="mb-0 fs-6 text-primary"><i class="fa fa-list me-2"></i>Transactions</h5>
                    <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary btn-sm d-flex align-items-center" (click)="downloadExcel()" [disabled]="transactions.length === 0">
              <i class="fa fa-download me-2"></i> Export to Excel
            </button>
            <div style="width: 250px;">
              <input type="text" class="form-control form-control-sm" placeholder="Search in results..." [(ngModel)]="searchTerm" (ngModelChange)="onGlobalSearch()" (keyup.enter)="onGlobalSearch()" />
            </div>
          </div>
        </div>
        <div class="card-body p-0">
                              <div class="table-responsive">
                        <table class="table table-bordered table-striped table-hover mb-0 text-nowrap" style="font-size: 0.85rem;">
              <thead class="table-light">
                <tr>
                  <th *ngFor="let key of previewKeys">
                    {{ key }}
                    <!-- Tooltip for Formula -->
                    <span *ngIf="formulaMap[key]" class="ms-1" style="cursor: pointer;" [title]="'Formula: ' + formulaMap[key]">
                      <i class="fa fa-info-circle text-primary"></i>
                    </span>
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let txn of transactions | paginate: { itemsPerPage: pageSize, currentPage: pageIndex, totalItems: totalItems }">
                  <td *ngFor="let key of previewKeys">
                    <!-- Specific Formatting -->
                    <ng-container *ngIf="key === 'Processing Status'; else defaultView">
                      <span class="badge" [ngClass]="{'bg-success': txn[key] === 'Success', 'bg-danger': txn[key] === 'Failed'}">
                        {{ txn[key] }}
                      </span>
                    </ng-container>
                    <ng-template #defaultView>
                      <ng-container *ngIf="key === 'Base Payable' || key === 'GST Amount' || key === 'TDS Amount' || key === 'Net Payable'">
                        {{ txn[key] | currency:'INR' }}
                      </ng-container>
                      <ng-container *ngIf="key !== 'Base Payable' && key !== 'GST Amount' && key !== 'TDS Amount' && key !== 'Net Payable' && key !== 'Processing Status'">
                        {{ txn[key] }}
                      </ng-container>
                    </ng-template>
                  </td>
                </tr>
                <tr *ngIf="transactions.length === 0">
                  <td [attr.colspan]="previewKeys.length > 0 ? previewKeys.length : 15" class="text-center py-4 text-muted">
                    <i class="fa fa-folder-open mb-2" style="font-size: 2rem;"></i>
                    <p class="mb-0">No transactions found for the selected criteria.</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end py-2" *ngIf="totalItems > 0">
          <pagination-controls (pageChange)="onPageChange($event)" [maxSize]="5" [directionLinks]="true" [autoHide]="true"></pagination-controls>
        </div>
      </div>

    </div>
  </div>
</div>
