<div class="row">
  <div class="col-12">
    <div class="card w-100 shadow-sm border-0">

      <!-- Card Header -->
      <div class="card-header bg-primary py-2 d-flex align-items-center justify-content-between">
        <h4 class="text-white mb-0">{{ isEditMode ? 'Edit Vendor Service' : 'Add New Vendor Service' }}</h4>
        <button class="btn btnheader" type="button" (click)="goBack()">
          Back
        </button>
      </div>

      <!-- Card Body Form -->
      <div class="card-body p-4">

        <div *ngIf="isLoading" class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <form *ngIf="!isLoading" (ngSubmit)="onSave()" novalidate>
          <div class="row g-3 align-items-end">

            <!-- 1. Vendor -->
            <div class="col-md-3 col-sm-6">
              <label class="form-label fw-semibold">Vendor <span class="text-danger">*</span></label>
              <ng-select [items]="vendors" bindLabel="text" bindValue="value" placeholder="Select Vendor"
                [(ngModel)]="formData.vendorID" name="vendorID" [clearable]="false" [searchable]="true" required>
              </ng-select>
            </div>

            <!-- 2. Location -->
            <div class="col-md-3 col-sm-6">
              <label class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
              <ng-select [items]="locations" bindLabel="text" bindValue="value" placeholder="Select Location"
                [(ngModel)]="formData.locationID" name="locationID" [clearable]="false" [searchable]="true" required>
              </ng-select>
            </div>

            <!-- 3. Client -->
            <div class="col-md-3 col-sm-6">
              <label class="form-label fw-semibold">Client <span class="text-danger">*</span></label>
              <ng-select [items]="clients" bindLabel="text" bindValue="value" placeholder="Select Client"
                [(ngModel)]="formData.clientID" name="clientID" [clearable]="false" [searchable]="true" required>
              </ng-select>
            </div>

            <!-- 4. Service Type -->
            <div class="col-md-3 col-sm-6">
              <label class="form-label fw-semibold">Service Type <span class="text-danger">*</span></label>
              <ng-select [items]="serviceTypes" bindLabel="label" bindValue="value" placeholder="Select Service Type"
                [(ngModel)]="formData.serviceType" name="serviceType" (ngModelChange)="onServiceTypeChange()"
                [clearable]="false" [searchable]="false" required>
              </ng-select>
            </div>

            <!-- 5. Percentage of (shown ONLY when Percentage is selected) -->
            <div class="col-md-3 col-sm-6" *ngIf="formData.serviceType === 'Percentage'">
              <label class="form-label fw-semibold">Percentage of <span class="text-danger">*</span></label>
              <ng-select [items]="percentageOfOptions" bindLabel="label" bindValue="value"
                placeholder="Select Percentage of" [(ngModel)]="formData.percentageType" name="percentageType"
                [clearable]="false" [searchable]="false" required>
              </ng-select>
            </div>

            <!-- 6. Service Charge -->
            <div class="col-md-3 col-sm-6">
              <label class="form-label fw-semibold">Service Charge <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="number" step="0.01" min="0" class="form-control" placeholder="Service Charge"
                  [(ngModel)]="formData.serviceCharge" name="serviceCharge" required />
                <span class="input-group-text bg-light text-muted">
                  {{ formData.serviceType === 'Percentage' ? '%' : '₹' }}
                </span>
              </div>
            </div>

            <div class="col-md-3 col-sm-6 d-flex align-items-end justify-content-start">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="isGratuity" [(ngModel)]="formData.isGratuity" name="isGratuity">
                <label class="form-check-label fw-semibold" for="isGratuity">Gratuity</label>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="col-md-3 col-sm-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4" [disabled]="isSaving">
                <i *ngIf="isSaving" class="fa fa-spinner fa-spin me-1"></i>
                {{ isEditMode ? 'Update' : 'Save' }}
              </button>
              <button type="button" class="btn btn-outline-secondary px-3" (click)="onCancel()">
                Cancel
              </button>
            </div>

          </div>
        </form>

      </div>

    </div>
  </div>
</div>
