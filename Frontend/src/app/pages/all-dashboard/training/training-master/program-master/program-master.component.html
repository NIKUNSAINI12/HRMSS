<div class="row">
    <div class="col-sm-12">
      <div class="card">
        <!-- Card Header -->
        <div class="card-header bg-primary">
          <div class="row w-100">
            <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
              <h4>{{Isedit? 'Edit Program Master':'Program Master'}}</h4> 
              
            </div>
            <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
              <button class="btn btnheader" routerLink="/dash/training/trainingdashboard/program_master_list">
                Back
              </button>
            </div>
          </div>
      </div>
  
        <!-- Card Body -->
        <div class="card-body mt-3">
          <form [formGroup]="programForm" >

            <div class="row" class="row row-cols-1 row-cols-md-3 g-4">
            

           

              <div class="col"><label>Program<span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="description" (blur)="checkDesignationAvailability(programForm.get('description')?.value)">
                
                <span *ngIf="showError && programForm.controls['description'].invalid && !programForm.get('description')?.errors?.['duplicate']" 
                class="text-danger mt-1" style="font-size: 12px;">Please enter shift name. </span>

                  <!-- Show validation error message from API only if it exists -->
                  <div *ngIf="programForm.get('description')?.errors?.['duplicate']" 
                      class="text-danger" style="font-size:10px;">
                      {{ programForm.get('description')?.errors?.['duplicate'] }}
                  </div>
              </div>




              <div class="col">
            <label for="remark">Remarks:<span class="text-danger">*</span></label>
            <div class="form-group">
              <input id="remark" type="text" class="form-control" formControlName="remarks">
               <span *ngIf="showError && programForm.controls['remarks'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                Please enter Remarks
            </span>    
            </div>
             
          </div>

          <div class="col">
            <label for="isActive">Active:</label>
            <div class="form-group">
              <input type="checkbox" formControlName="active">
            </div>      
          </div>

              
          </div>
          <!-- Footer buttons -->
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary mx-1" (click)="submitForm()">
                 {{ Isedit ? 'Update' : 'Save' }} 
            </button>
            <button type="button" class="btn btn-outline-dark mx-1" >Reset</button>

           </div>
           
          </form>
        </div>
      </div>
    </div>
  </div>
