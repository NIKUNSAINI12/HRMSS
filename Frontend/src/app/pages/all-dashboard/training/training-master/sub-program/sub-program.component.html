<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <!-- Card Header -->
      <div class="card-header bg-primary">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
            <h4>{{Isedit? 'Edit Sub Program Master':' Sub Program Master'}}</h4>
          </div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/training/trainingdashboard/subprogram_master_list">
              Back
            </button>
          </div>
        </div>
      </div>

      <!-- Card Body -->
      <div class="card-body mt-3">
        <form [formGroup]="subprogramForm">

          <div class="row" class="row row-cols-1 row-cols-md-3 g-4">

            <div class="col">
              <label>Program<span style="color: red;">*</span></label>
              <ng-select [items]="programddl" bindLabel="name" bindValue="value" formControlName="fk_programId"
                placeholder="-select code-"></ng-select>

              <!-- Validation message below input field -->
              <span *ngIf="showError && subprogramForm.controls['fk_programId'].invalid" class="text-danger mt-1"
                style="font-size: 12px;">
                Select Department.
              </span>

            </div>
            <div class="col">
              <label>Sub Program<span class="text-danger fw-bold">*</span></label>
              <input type="text" class="form-control" formControlName="subProgramName"/>
              <span *ngIf="showError && subprogramForm.controls['subProgramName'].invalid" class="text-danger mt-1"
                style="font-size: 12px;">please enter Subject</span>
            </div>







            

            <div class="col">
              <label for="isActive">Active:</label>
              <div class="form-group">
                <input type="checkbox" formControlName="isActive">
              </div>
            </div>


          </div>
          <!-- Footer buttons -->
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary mx-1" (click)="submitForm()">
              {{ Isedit ? 'Update' : 'Save' }}
            </button>
            <button type="button" class="btn btn-outline-dark mx-1">Reset</button>

          </div>

        </form>
      </div>
    </div>
  </div>
</div>
