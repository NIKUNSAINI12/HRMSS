<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <div class="row w-100">
          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
            <h4>List of Training Ratings</h4>
          </div>
<!-- dash/training/trainingdashboard/TrainingRatingList -->
          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
            <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
          </div>

          <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/training/trainingdashboard/TrainingRating">
              Add
            </button>
            <button class="btn btn-light mx-1" (click)="exportToExcel()">
              Download
            </button>
          </div>
        </div>
      </div>

      <div class="card-body">
        <div class="table-responsive table-invoice">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>S. No.</th>
                <th>Description</th>
                <th>Remarks</th>
                <th>Active</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="
                  let item of filteredData()
                    | paginate: {
                        itemsPerPage: pageSize,
                        currentPage: pageIndex,
                        totalItems: totalItems
                      };
                  let i = index
                ">
                <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                <td>{{ item.description }}</td>
                <td>{{ item.remarks }}</td>
                <!-- <td>{{ item.active}}</td> -->

                 <td [ngClass]="item.active.trim() === 'YES' ? 'text-success' : 'text-danger'">
                  {{ item.active }}
                </td>
                
                <td>
                  <button class="btn btn-sm btn-outline" (click)="edit(item.pk_ratingId)">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </button>
                  <button class="btn btn-sm btn-outline" (click)="delete(item.pk_ratingId)">
                    <i class="fa fa-trash"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="filteredData().length === 0">
                <td colspan="5" class="text-center">No data available</td>
              </tr>
            </tbody>
          </table>

          <!-- Pagination -->
          <pagination-controls (pageChange)="onPageChange($event)" [responsive]="true">
          </pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
