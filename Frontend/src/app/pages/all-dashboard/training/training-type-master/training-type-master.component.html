<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">

      <div class="card-header bg-primary">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
            <h4 class="">{{Isedit ? 'Update Training Type Master' : 'Training Type Master' }}</h4>
          </div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <!--    <button class="btn btnheader" routerLink="/dash/payroll/payrolldashboard/FunctionalList">Back</button>
           -->
            <button class="btn btnheader"
              routerLink="/dash/training/trainingdashboard/training_type_master_list">Back</button>
          </div>

        </div>
      </div>

      <!-- main header close -->

      <!--  -->

      <div class="card-body mt-4">
        <form class="row row-cols-1 row-cols-md-3 g-4" [formGroup]="TrainingMaster">

          <div class="col">
            <label for="Description">Description<span style="color: red;">*</span></label>
            <input id="Description" type="text" class="form-control" formControlName="description" (blur)="checkDuplicate(TrainingMaster.get('description')?.value)"/>

            <!-- <input id="Description" type="text" class="form-control" formControlName="description" /> -->

            <span
              *ngIf="showError &&TrainingMaster.controls['description'].invalid && !TrainingMaster.get('description')?.errors?.['duplicate']"
              class="text-danger mt-1 lh-base" style="font-size: 12px;">
              Please enter training type.
            </span>

            <div *ngIf="TrainingMaster.get('description')?.errors?.['duplicate']" class="text-danger lh-base"
              style="font-size:10px;">
              {{ TrainingMaster.get('description')?.errors?.['duplicate'] }}
            </div>


          </div>


          <div class="col">
            <label>
              Remark
            <span style="color: red;">*</span></label>
            <input type="text" name="remarks" formControlName="remarks" class="form-control">

            <span *ngIf="showError && TrainingMaster.controls['remarks'].invalid" class="text-danger mt-1"
              style="font-size: 12px;">
              Please enter Remark.
            </span>
          </div>


          <div class="col d-flex justify-content-start  align-items-center">
            <input id="active" checked type="checkbox" formControlName="active">&nbsp;
            <label for="active">
              Active
            </label>
          </div>



        </form>
        <!-- Buttons -->
        <div class="modal-footer">
          <button class="btn btn-primary mx-1" (click)="onSubmit()">{{ Isedit ? 'Update' : 'Save'
            }}</button>
          <button type="reset" (click)="resetForm()" class="btn btn-outline-dark mx-1">Reset</button>

        </div>
      </div>








    </div>
  </div>
</div>
