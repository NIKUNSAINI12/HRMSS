<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
      <div class="card">
   
    <!--  -->
 
 <div class="card-header bg-blue ">
    <div class="row w-100 ">
  <div class="col-sm-12 col-md-6 col-lg-6  ">
       <h4 class="">Export & Import Attendance OT</h4></div>

    </div>

 </div>
<div class="card-body mt-4">
  <form [formGroup]="AttendanceForm"class="row row-cols-1 row-cols-md-3 g-4">

    <div class="col">
        <label>Month</label>               
        <div class="form-group">
          <ng-select id="year" [items]="months" bindLabel="name" bindValue="value"
          formControlName="month" placeholder="--Select --"
          class="w-100"></ng-select>
          <span *ngIf="showError && AttendanceForm.controls['month'].invalid" class="text-danger mt-1" style="font-size: 12px;">
            Please enter Month.
          </span>
        </div> 
    </div>
    <div class="col">
      <label>Year</label>
  
      <div class="form-group">
        <ng-select id="year" [items]="years" bindLabel="name" bindValue="value"
        formControlName="year" placeholder="--Select --"
        class="w-100"></ng-select>
        <span *ngIf="showError && AttendanceForm.controls['year'].invalid" class="text-danger mt-1" style="font-size: 12px;">
          Please enter Year.
         </span>
      </div> 
  </div>
  <div class="col">
    <label>Location</label>
    <ng-select 
      [items]="locations"
      bindLabel="name"
      bindValue="value"
      [multiple]="true"
      [(ngModel)]="selectedLocations"
      [closeOnSelect]="false"
      placeholder="--Select Locations--"
      class="w-100">
      
      <!-- Custom Checkbox for Select All -->
      <ng-template ng-option-tmp let-item="item" let-index="index">
        <div *ngIf="index === 0">
          <input 
            type="checkbox" 
            class="form-check-input fs-6 mx-1"
            (change)="toggleSelectAll($event)" 
            [checked]="isAllSelected()" /> 
          <strong>Select All</strong>
        </div>
        <div *ngIf="index !== 0">
          <input 
            type="checkbox" 
            class="form-check-input fs-6 mx-1"
            [checked]="selectedLocations.includes(item.value)"
            (change)="toggleLocation(item.value)" /> 
          {{ item.name }}
        </div>
      </ng-template>
  
    </ng-select>
          </div>

  </form>
  <div class="row">
    <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
   
        <button type="button" class="btn btn-primary  mx-1"(click)=" OnSubmit()">Export To Hour</button>  
        <button type="button" class="btn btn-primary  mx-1"(click)=" OnSubmit()">Export To DateWise</button>                   
                 
    </div>
</div>
</div>

    <!--  -->
    <div class="card-header bg-blue ">
        <div class="row w-100 ">
      <div class="col-sm-12 col-md-6 col-lg-6  ">
           <h4 class="">Import Attendance OT</h4></div>
  
        </div>
  
     </div>
    <div class="card-body mt-4">
      <form [formGroup]="ImportForm"class="row row-cols-1 row-cols-md-3 g-4">
      
            <div class="col"><label>Select File</label>
                <div class="form-group">
                    <input  type="file" class="form-control flex-grow-1" formControlName="file">
                    
                </div>                
            </div>
         

      </form>
      <div class="row">
        <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
       
            <button type="button" class="btn btn-outline-dark mx-1"(click)="resetForm()">Reset</button>
            <button type="button" class="btn btn-primary  mx-1">Import</button>                   
        </div>
    </div>
    </div>




      
</div>
</div>
</div>
