
<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
         <!--  -->
    <div class="card-header bg-blue ">
        <div class="row w-100 ">
      <div class="col-sm-12 col-md-6 col-lg-6 ">                    
        <h4>Employee Search Criteria</h4>   
      </div>
    
  </div>
  
      
      </div>
      <div class="card-body mt-4">
        <form [formGroup]="EmployeeForm">
          <div class="row">

            <app-common-search ></app-common-search>
        </div>
        <div class="row row-cols-1 row-cols-md-3">
        
            <div class="col">
              <label>Office Type</label>
         
              <div class="form-group">
                <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                formControlName="officeType" placeholder="--Select --"
                class="w-100"></ng-select>
              </div>  
          </div>
    
                <div class="col">
                    <label>From date</label>
                    <div class="form-group">
                        <input type="date"class="form-control"formControlName="fromDate">
                    </div>
                </div>
                <div class="col">
                    <label>To Date</label>
                    <div class="form-group">
                        <input type="date"class="form-control"formControlName="toDate" >
                    </div>
                </div>
                
            </div>
                       
            <div class="modal-footer"> 
                <button type="submit" class="btn btn-primary mx-1"(click)="toggleEmployeeList()">Search</button>
                <button type="submit" class="btn btn-outline-dark mx-1"(click)="resetForm()">Reset</button>
                 <button type="submit" class="btn btn-primary mx-1">Export</button>

              </div>
        </form>
      </div>
<!-- List of Employee -->
