
<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
         <!--  -->
    <div class="card-header bg-blue ">
        <div class="row w-100 ">
      <div class="col-sm-12 col-md-6 col-lg-6 ">                    
        <h4>Salary Bank Statement</h4>   
      </div>
     
  </div>
  
      
      </div>
      <div class="card-body mt-4">
        <form [formGroup]="EmployeeForm">
          <div class="row">

            <app-common-search ></app-common-search>
        </div>
        <div class="row row-cols-1 row-cols-md-3">
          
            <div class="col">
              <label>Office Type</label>
         
              <div class="form-group">
                <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                formControlName="OfficeType" placeholder="--Select --"
                class="w-100"></ng-select>
              </div>  
          </div>
        
              <div class="col">
                <label>Bank Name</label>            
                <div class="form-group">
                  <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                  formControlName="bankName" placeholder="--Select --"
                  class="w-100"></ng-select>
                  <span *ngIf="showError &&EmployeeForm.controls['bankName'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                    Please enter Bank Name.
                  </span>
                </div>  
            </div>
              
                <div class="col">
                    <label>Month</label>               
                    <div class="form-group">
                      <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                      formControlName="month" placeholder="--Select --"
                      class="w-100"></ng-select>
                      <span *ngIf="showError &&EmployeeForm.controls['month'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                        Please enter Month.
                      </span>
                    </div> 
                </div>
                <div class="col">
                  <label>Year</label>
              
                  <div class="form-group">
                    <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                    formControlName="year" placeholder="--Select --"
                    class="w-100"></ng-select>
                    <span *ngIf="showError &&EmployeeForm.controls['year'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                      Please enter Year.
                    </span>
                  </div> 
              </div>
                

              <div class="col">
                <label>Salary Type</label>           
                <div class="form-group">
                  <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                  formControlName="salaryType" placeholder="--Select --"
                  class="w-100"></ng-select>
                  <span *ngIf="showError &&EmployeeForm.controls['salaryType'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                    Please enter Salary Type.
                  </span>
                </div> 
              </div>   
            <div class="col">
              <label>Report Type</label>         
              <div class="form-group">
                <ng-select id="year" [items]="selects" bindLabel="name" bindValue="value"
                formControlName="reportType" placeholder="--Select --"
                class="w-100"></ng-select>
                <span *ngIf="showError &&EmployeeForm.controls['reportType'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                  Please enter Report Type.
                </span>
              </div> 
            </div>
              <div class="col">
                <label>File Type</label>
                    <div class="form-group">
                      <input type="radio"value="1"formControlName="fileType"class="form-check-input fs-6 mx-1">Excel File&nbsp;
                      <input type="radio"value="2"formControlName="fileType"class="form-check-input fs-6 mx-1">Text File

                  </div>    
          </div> 
             
           </div>
            
           
           
            <div class="modal-footer">

                <button type="submit" class="btn btn-outline-dark mx-1"(click)="resetForm()">Reset</button>
                 <button type="submit" class="btn btn-primary mx-1"(click)="OnVeiw()">Veiw</button>
           
              </div>
        </form>
      </div>

      
  </div>
</div>    

</div>
