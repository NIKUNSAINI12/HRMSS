<!-- Payroll Tabs Section -->
<div class="row">
  <div class="col-12">
    <div class="card">

      <!-- main header  -->

      <div class="card-header bg-primary py-lg-1 mt-0">
        <div class="row w-100 align-items-center">

          <!-- Title Section -->
          <div class="col-12 col-md-3">
            <h4>Team Structure</h4>
          </div>

          <!-- Search Section -->
          <div class="col-12 col-md-7 mt-2 mt-md-0">
            <app-common-search (filtersChanged)="handleFilters($event)"></app-common-search>
          </div>


        </div>
      </div>

      <!-- main header close -->




      <!-- Salary Disbursement Tab -->

      <div class="card-body">
        <form [formGroup]="organizationForm">
          <!--  -->


          <div class="row mt-2 px-2">
            <div class="col-md-4">
              <label for="SelectEmployeeType" class="">Employee</label>
              <ng-select [items]="EmployeeList" id="SelectEmployeeType" bindLabel="name"
                formControlName="SelectEmployeeType" placeholder="--Select Employee--" class="w-100"
                (change)="onEmployeeChange($event)"
                 [searchable]="true"
                (search)="onEmployeeSearch($event)" [loading]="loadingEmployees" loadingText="Searching employees...">
              </ng-select>
            </div>
          </div>
          <!--  -->


          <div class="row" *ngIf="selectedEmployeeData">
            <p class="text-center fs-6 fw-bold mb-4 text-dark">Team Tree</p>
            <div class="child-group mt-3 subordinate-scroll">
              <div class="child-branch" *ngFor="let phase of salaryDisbursement; let i = index">

                <!-- Top Person -->
                <div class="org-box glass-card smart-box text-center position-relative px-2 pt-4 pb-2">
                  <div class="org-img-wrapper-sm">
                    <img [src]="phase.image" [alt]="phase.title + ' image'" class="org-img-sm">
                  </div>

                  <div *ngIf="head.length === 0"> <span class="small p-2" style="font-size: 12px; font-weight: 600;">No
                      Head Data Found!</span></div>
                  <div class="fw-semibold mt-2 small-text lh-lg p-2 d-flex flex-column" *ngFor="let headItem of head">
                    <span class="xsmall text-dark fw-semibold">{{headItem.empname}}</span>
                    <span class="xsmall-text text-primary">{{ headItem.department }}</span>
                  </div>
                </div>

                <!-- Connector Line -->
                <div class="vertical-line mx-auto"></div>

                <!-- Managers Block -->
                <!-- Manager -->
                <div class="d-flex flex-column align-items-center">
                  <div *ngFor="let mgr of phase.manager.managers"
                    class="org-box glass-card smart-box text-center position-relative px-2 pt-4 pb-2 mt-3">
                    <div class="org-img-wrapper-sm">
                      <img [src]="mgr.image" [alt]="mgr.name + ' image'" class="org-img-sm">
                    </div>

                    <div *ngIf="manager.length === 0"> <span class="small p-2"
                        style="font-size: 12px; font-weight: 600;">No Head Data Found!</span></div>
                    <div class="fw-semibold text-dark mt-2 small-text lh-lg p-2 d-flex flex-column"
                      *ngFor="let managerItem of manager">
                      <span class="xsmall text-dark">{{ managerItem.empname }}</span>
                      <span class="xsmall-text text-primary fw-semibold">{{ managerItem.department }}</span>
                    </div>
                  </div>
                </div>
                <!-- Connector Line -->
                <div class="vertical-line mx-auto"></div>
