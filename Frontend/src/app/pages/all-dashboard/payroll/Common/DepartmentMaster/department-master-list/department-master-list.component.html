<div class="row">
  <div class="col-12">
    <div class="card">
      <!--  -->
      <div class="card-header bg-primary">
          <div class="row w-100">


            <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
              <h4>All Department List</h4>
             
            </div>
            <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
              <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" (ngModelChange)="onSearchTextChanged()"/>
            </div>
            <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
              <button class="btn btnheader" routerLink="/dash/user/userdashboard/DepartmentForm">
                   Add
              </button>

              <button class="btn btn-light mx-1" (click)="exportToExcel()">
                Download
              </button>
            </div>
          
          </div>
        </div>

      
      <!--  -->
      <div class="card-body">
        <div class="table-responsive table-invoice">
          <table Id="exportTable"  class="table table-bordered">
            <thead>
              
              <tr>
                  <th>Sr.</th>
                  <th>Department</th>
                  <th>Active</th>
                  <th>Action</th>
                 
              </tr>
              
            </thead>
           
              <tbody>
                  <tr *ngFor="let item of  filteredData() | paginate: { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems:totalItems};let i = index">
                      <td>{{(pageIndex-1)* pageSize+i+1}}</td>
                      <td>{{ item.description }}</td>
          
                      <td>{{ item.activeAlias}}</td>
                      <td>
                        <!-- <button class="btn" (click)="isUpdate(item.pk_DeptId)"><i class="fa-regular fa-pen-to-square"></i></button> -->
                       
                        <button class="btn btn-sm btn-outline"(click)="isUpdate(encryptionService.encryptText(item.pk_DeptId))"><i class="fa-solid fa-pen-to-square" ></i></button>

                        <button class="btn" (click)="deleteDepartment(item.pk_DeptId)"> <i class="fa-solid fa-trash"></i></button>
                      </td>
                      </tr>
          
          </table>

          <!-- Pagination controls -->
          <pagination-controls (pageChange)="onPageChange($event)" >
          </pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
