<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary">
                <div class="row w-100">
                  <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
                    <h4>List of Bank</h4>
                   
                  </div>
                  <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
                    <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" (ngModelChange)="onSearchTextChanged()" />
                  </div>
                  <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
                    <button class="btn btnheader" routerLink="/dash/user/userdashboard/bankMaster">
                         Add
                      </button>
                      <button class="btn btn-light mx-1" (click)="exportToExcel()">
                        Download
                      </button>
                  </div>
                 
                  
                </div>
            </div>
<div class="card-body">
        <div class="table-responsive table-invoice">
          <table id="exportTable" class="table">
            <thead>
              <tr>
                <th>Sr.No</th>
                <th>Bank Name</th>
                <th>IFSC Prefix</th>
                <th>Account Length(Min)</th>
                <th>Account Length(Max)</th>

                <th>Action</th>

              </tr>
            </thead>
            <tbody>
              <tr
                *ngFor=" let item of filteredData() 
                        | paginate : { itemsPerPage: pageSize, currentPage: page ,totalItems: totalItems };let i = index">
                <td>{{ (page - 1) * pageSize + i + 1 }}</td>

                <td>{{ item.bankName }}</td>
                <td>{{ item.ifsC_Prefix }}</td>
                <td>{{ item.bankAccount_Min }}</td>
                <td>{{ item.bankAccount_Max }}</td>

                <td>

                  <button class="btn " (click)="Isedit(encryptionService.encryptText(item.pk_BankId.toString()))">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button class="btn "><i class="fa fa-trash" (click)="deleteBank(item.pk_BankId)"></i></button>
                </td>
              </tr>
            </tbody>

          </table>
          <pagination-controls (pageChange)="onPageChange($event)" [responsive]="true">
          </pagination-controls>

          <ng-template #noData>
            <tr>
              <td colspan="4" class="text-center">No data available</td>
            </tr>
          </ng-template>
                
                    
                  </div>
            </div>
        </div>
    </div>
</div>
