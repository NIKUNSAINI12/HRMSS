<div class="row">
    <div class="col-12">
        <div class="card">
            <!-- heading -->
            <div class="card-header bg-primary">
                <div class="row w-100">
                    <!-- Title Section -->
                    <div class="col-sm-6 col-md-6 col-lg-6 d-flex align-items-center justify-content-start">
                        <h4 class="text-white">Employee Weekly Off Master List</h4>
                    </div>

                    <!-- Back Button -->
                    <div class="col-sm-6 col-md-6 col-lg-6 d-flex align-items-center justify-content-end ms-auto gap-2">
                        <button class="btn btn-light" routerLink="/dash/payrollmaster/Master">
                            <i class=""></i>Add
                        </button>
                    </div>
                </div>
            </div>

            <!-- main -->
            <div class="card-body">
                <div class="table-responsive table-invoice">
                    <table Id="exportTable" class="table">
                        <thead>

                            <tr>
                                <td>Sr.No</td>
                                <td>Location</td>
                                <td>Sun</td>
                                <td>Mon</td>
                                <td>Tue</td>
                                <td>Wed</td>
                                <td>Thur</td>
                                <td>Fri</td>
                                <td>Sat</td>
                                <td>Action</td>
                            </tr>
                        </thead>

                        <tbody>
                            <tr
                                *ngFor="let data of weekOffData | paginate: { itemsPerPage: pageSize, currentPage: page }; let i = index">
                                <td>{{ data.srNo }}</td>
                                <td>{{ data.location }}</td>
                                <td><input type="checkbox" [checked]="data.sun" disabled /></td>
                                <td><input type="checkbox" [checked]="data.mon" disabled /></td>
                                <td><input type="checkbox" [checked]="data.tue" disabled /></td>
                                <td><input type="checkbox" [checked]="data.wed" disabled /></td>
                                <td><input type="checkbox" [checked]="data.thu" disabled /></td>
                                <td><input type="checkbox" [checked]="data.fri" disabled /></td>
                                <td><input type="checkbox" [checked]="data.sat" disabled /></td>
                                <td>
                                    <button class="btn btn-danger" (click)="deleteWeekOff(data.srNo)">Delete</button>
                                </td>
                            </tr>
                        </tbody>


                    </table>

                    <!-- Pagination controls -->
                    <pagination-controls (pageChange)="onPageChange($event)" totalItems="totalItems"
                        itemsPerPage="pageSize">
                    </pagination-controls>
                </div>
            </div>
        </div>
    </div>
</div>
