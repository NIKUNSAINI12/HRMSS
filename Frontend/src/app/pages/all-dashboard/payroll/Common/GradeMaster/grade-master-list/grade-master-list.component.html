<div class="row">
  <div class="col-12">
    <div class="card">
      <!--  -->
      <div class="card-header bg-primary">
          <div class="row w-100">
            <!-- Title Section -->
            <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
              <h4 class="text-white">List of Grade</h4>
            </div>
         
            <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
              <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText"/>
            </div>
            <!-- Back Button -->
            <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-end">
              <button class="btn btnheader" routerLink="/dash/user/userdashboard/gradeMaster">
                  Add
              </button>
            <button class="btn btn-light mx-1" (click)="exportToExcel()">
              Download
            </button>
            </div>
          </div>
        </div>

      <!--  -->
      <div class="card-body">
        <div class="table-responsive table-invoice">
          <table Id="exportTable"  class="table">
          
              <thead>
                  <tr>
                    <th>Sr.</th>
                    <th>Description</th>
                    <th>Notice Period</th>
                    <th>Action</th>
                  </tr>
            </thead>
           
            <tbody>
              <tr *ngFor="let item of filteredData()  |paginate: { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems:totalItems};let i = index">
                <td>{{(pageIndex-1)* pageSize+i+1}}</td>
                <td>{{ item.classname }}</td>
                <td>{{ item.noticePeriod}}</td>
                
                <td>
                  <button class="btn btn-sm btn-outline" (click)="isUpdate(encryptionService.encryptText(item.pk_classid).toString())"> <i class="fa-regular fa-pen-to-square"></i></button>
                <button class="btn btn-sm btn-outline" (click)="deleteGrade(item.pk_classid)">   <i class="fa fa-trash"></i></button></td>
              </tr>
            
            </tbody>
          
          </table>

          <!-- Pagination controls -->
          <pagination-controls
          (pageChange)="onPageChange($event)"
            totalItems="totalItems"
            itemsPerPage="pageSize">
          </pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
