<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary">
                <div class="row w-100">
                  <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
                    <h4>
                        {{Isedit? 'Update Role Master' : 'Role Master'}}</h4>
                  </div>
                  <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
                    <button class="btn btnheader" routerLink="/dash/user/userdashboard/RoleMaster_list">
                      Back
                    </button>
                  </div>
    
                </div>
            </div>

            <div class="card-body mt-4">
                <form [formGroup]="RoleForm">
                    <!-- Department Name -->
                    <div class="row" class="row row-cols-1 row-cols-md-3 g-4">

                        <div class="col">
                            <label for="description">Role Name<span style="color: red;">*</span></label>
                            <div class="form-group">
                                <input id="description" type="text" class="form-control" formControlName="RoleName" (blur)="checkDesignationAvailability(RoleForm.get('RoleName')?.value)"/>
                               
                                    <span *ngIf="showError  && RoleForm.controls['RoleName'].invalid && !RoleForm.get('RoleName')?.errors?.['duplicate']" 
                                      class="text-danger mt-1" style="font-size: 12px;"> Please enter Role </span>
                                     
                             <!-- Show validation error message from API only if it exists -->
                                  <div *ngIf="RoleForm.get('RoleName')?.errors?.['duplicate']" 
                                       class="text-danger" style="font-size:10px;">
                                    {{ RoleForm.get('RoleName')?.errors?.['duplicate'] }}
                                         </div>

                            </div>
                        </div>

                        <div class="col">
                            <label for="Remarks" >Description</label>
                            <div class="form-group">
                                <input type="text" formControlName="Description" class="form-control" />

                           
                            </div>
                        </div>
                        <div class="col">
                            <label for="isactive" >Active</label>
                            <div class="form-group">
                                <input type="checkbox" id="isactive" formControlName="IsActive" class="form-check-input" />

                            </div>
                        </div>
                      
                           <!-- Footer buttons -->
                            <div class="col"></div>
                            <div class="col"></div>

                    <div class="col d-flex align-items-center justify-content-md-end">
                        <button type="submit"  class="btn btn-primary mx-1" (click)="submitForm()">{{Isedit? 'Update' : 'Save'}}</button>
                        <button type="reset" class="btn btn-outline-dark mx-1">Reset</button>
                        
                    </div>
                    
                    </div>

                 

                </form>
            </div>
        </div>
    </div>
</div>
