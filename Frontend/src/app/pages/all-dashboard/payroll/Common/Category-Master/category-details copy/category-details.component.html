
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <div class="row w-100">
                  <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
                    <h4>Category Details</h4>
                   
                  </div>
                  <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
                    <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
                  </div>
                  
                  <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
                    <button class="btn btnheader" routerLink="/dash/user/userdashboard/categoryMaster">
                        Add
                      </button>
                      <button class="btn btn-light mx-1" (click)="exportToExcel()">
                        Download
                      </button>
                  </div>
                  
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive table-invoice">
                    <table id="exportTable" class="table table-bordered">
                        <thead>
                          <tr>
                            <th>Sr.No</th>
                            <th>Category Name</th>
                            <th>Action</th>
                            
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let item of filteredData() 
                          | paginate : { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems: totalItems };let i = index">
                      <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
  
                            <td>{{ item.category}}</td>
                            <td>
                              <button class="btn btn-sm btn-outline"  ><i class="fa-regular fa-pen-to-square" (click)="isUpdate(encryptionService.encryptText(item.pk_Catid.toString()))"></i></button>
                            
                             <button class="btn btn-sm btn-outline"><i class="fa fa-trash"(click)="deleteCategory(item.pk_Catid)"></i></button>
                            </td>
                          </tr> 
                        </tbody>
                      </table>
                      <pagination-controls
                      (pageChange)="onPageChange($event)"
                      [responsive]="true">
                    </pagination-controls>
                  
                          <ng-template #noData>
                            <tr>
                              <td colspan="4" class="text-center">No data available</td>
                            </tr>
                          </ng-template>
                    
                  </div>
            </div>
        </div>
    </div>
</div>
