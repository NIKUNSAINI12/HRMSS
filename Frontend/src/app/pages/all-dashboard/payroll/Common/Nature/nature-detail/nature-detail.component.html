
<div class="row">
  <div class="col-12">
      <div class="card">
          <div class="card-header">
              <div class="row w-100">
                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
                  <h4>Nature Details</h4>
                 
                </div>
                
                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
                  <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
                </div>
                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
                  <button class="btn btnheader" routerLink="/dash/user/userdashboard/natureMaster">
                       Add
                    </button>
                    <button class="btn btn-light mx-1" (click)="downloadExcel()">
                      Download
                    </button>
                </div>
                
              </div>
          </div>
          <div class="card-body">
              <div class="table-responsive table-invoice">
                  <table id="exportTable" class="table table-bordered">
                      <thead>
                        <tr>
                          <th>Sr.</th>
                          <th>Nature Name</th>
                          <th>Action</th>
                          
                        </tr>
                      </thead>
                   
                      <tbody>
                        <tr *ngFor=" let item of filteredData() 
                        | paginate : { itemsPerPage: pageSize, currentPage: page ,totalItems: totalItems };let i = index">
      
                          <td>{{ (page - 1) * pageSize + i + 1 }}</td>
                          <td>{{ item.nature }}</td>
                          <td>
                            <button class="btn btn-sm btn-outline" (click)="isUpdate(encryptionService.encryptText(item.pk_natureid).toString())">
                              <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                            <!-- <button class="btn btn-sm btn-outline"(click)="isUpdate(encryptionService.encryptText(item.pk_natureid).toString())"><i class="fa-solid fa-pen-to-square" ></i></button> -->

                            <button class="btn btn-sm btn-outline" (click)="deleteNature(item.pk_natureid)">
                              <i class="fa fa-trash"></i>
                            </button>
                          </td>
                        </tr>
                      </tbody>
                      
                    </table>
                    <pagination-controls (pageChange)="onPageChange($event)" >
                    </pagination-controls>
                
                  
                </div>
          </div>
      </div>
  </div>
</div>
