
    <div class="row">
      <div class="col-12">
        <div class="card">
          <!--  -->
          <div class="card-header bg-primary">
              <div class="row w-100">
                <!-- Title Section -->
                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
                  <h4 class="text-white">All City Master List</h4>
                </div>
              
                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
                  <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" (ngModelChange)="onSearchTextChanged()" />
                </div>

                <!-- Back Button -->
                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-end">
                   
                 


                <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
                  <button class="btn btnheader" routerLink="/dash/user/userdashboard/city-master">
                    Add
                    </button>
                    <button class="btn btn-light mx-1" (click)="exportToExcel()">
                      Download
                    </button>
                </div>
                </div>
              </div>
            </div>
            <!-- <p *ngIf="fk_stateid">Showing cities for state: <strong>{{ fk_stateid }}</strong></p> -->

            <!--  -->

            <div class="card-body">
              <div class="row g-4">
                <div class="col-md-4"><label>State</label>
           
                  <ng-select 
                  [items]="States" 
                  bindLabel="name" 
                  bindValue="value" 
                  [(ngModel)]="fk_stateid"
                  (change)="onStateChange(fk_stateid)"
                  placeholder="--Select State-- "
                  [clearable]="true"
                  class="w-100"
                  >
                </ng-select>
                  
                </div>
              </div>
              
            </div>
            <div class="card-body">
              <div class="table-responsive table-invoice">
                <table Id="exportTable"  class="table table-bordered">
                  <thead>
                    <tr>
                      <th>Sr.No.</th>
                      <th>State</th>
                      <th>City</th>
                      <th>Metro</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>

                    <tr *ngFor="let city of filteredData() | paginate: { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems:totalItems};let i = index">

                      <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                       <td>{{ city.description  }}</td> 
                      <td>{{ city.cityname }}</td>
                      <td>{{ city.metroName}}</td>
                      <td>
                        <button class="btn btn-sm btn-outline"(click)="isUpdate(encryptionService.encryptText(city.pk_cityid).toString())"><i class="fa-solid fa-pen-to-square" ></i></button>
                        <button class="btn btn-sm btn-outline"  (click)="deletecity(city.pk_cityid)" ><i class="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  </tbody>
                </table>
      
               <!-- Pagination controls -->
               <pagination-controls (pageChange)="onPageChange($event)"></pagination-controls>
              </div>
            </div>
          </div>
        </div>
      </div>
