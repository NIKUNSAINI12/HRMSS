
        <div class="row">
            <div class="col-sm-12 col-md-12 col-lg-12">
              <div class="card">
           
            <!-- header -->
            <div class="card-header bg-primary">
              <div class="row w-100">
                <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
                  <h4>{{Isedit? 'Edit City':'City Master'}}</h4>
        
                </div>
               
                <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
                  <button class="btn btnheader" routerLink="/dash/user/userdashboard/city-master_list">
                    Back
                  </button>
                </div>
              </div>
          </div>
        <!-- Body section area -->
        <div class="card-body mt-2">
          
            <form  [formGroup]="cityForm" (ngSubmit)="submitForm()">
                <!-- State Field -->
                <div  class="row row-cols-1 row-cols-md-3 g-4">
               
                    <div class="col">
                        <label for="fk_stateid" class="form-label">State :<span class="text-danger">*</span></label>
                        <ng-select [items]="States" id="fk_stateid" bindLabel="name" bindValue="value" formControlName="fk_stateid"  placeholder="-select code-"></ng-select>
                        <!-- Validation message below input field -->
                        <span *ngIf="showError && cityForm.controls['fk_stateid'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                            Please select State .
                        </span> 
                    </div>
                <!-- City Field -->
                    <div>
                  
                      <label for="cityname" class="form-label">City:<span style="color: red;">*</span></label>
      
                      <input id="cityname" type="text" class="form-control" formControlName="cityname" (blur)="checkDesignationAvailability(cityForm.get('cityname')?.value)">
      
                      <span *ngIf="showError && cityForm.controls['cityname'].invalid && !cityForm.get('cityname')?.errors?.['duplicate']" 
                      class="text-danger mt-1" style="font-size: 12px;">Please enter city. </span>
      
                   
                        <!-- Show validation error message from API only if it exists -->
                        <div *ngIf="cityForm.get('cityname')?.errors?.['duplicate']" 
                            class="text-danger" style="font-size:10px;">
                            {{ cityForm.get('cityname')?.errors?.['duplicate'] }}
                        </div>
                    </div>

                <!-- Checkboxes -->
            
                    <div class="col">
                        <label class="form-label" >Is Metro: <span class="text-danger"></span> </label>
                        <div class="form-group">
                            <input class="form-check-input" type="checkbox"  formControlName="isMetro">
                        </div> 
                       
                    </div>

                    
                    <div class="col">
                        <label for="isActive">Is Active:</label>
                        <div class="form-group">
                          <input class="form-check-input" type="checkbox" formControlName="isCActive">
                        </div>      
                      </div>
            
                   
                </div>

                 <!-- Footer buttons -->
                 <div class="modal-footer">
                    <button type="submit" class="btn btn-primary mx-1">
                        {{ Isedit ? 'Update' : 'Save' }}
                    </button>
                    <button type="reset" class="btn btn-outline-dark mx-1">Reset</button>
                    
                    <!-- <button type="button" class="btn btn-outline-dark mx-1" (click)="viewFilteredList()">View</button> -->

                    <!-- <button type="reset" class="btn btn-outline-dark mx-1">View</button> -->


                </div>

            
             </form>
                           
                       
              
              
            </div>
        </div>
    </div>
