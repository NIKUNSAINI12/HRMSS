<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary">
                <div class="row w-100">
                  <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
                    <h4>Salary Slip Master </h4>
                  </div>
                  <!-- <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
                    <button class="btn btnheader" routerLink="/dash/payroll/payrolldashboard/">
                      goTolist
                    </button>
                  </div> -->
    
                </div>
            </div>

            <div class="card-body mt-4">

                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <input type="text" [(ngModel)]="commonMessage"  name="type" class="form-control w-50" placeholder="enter ">
                    <button class="btn btn-warning" (click)="fillAll()">FILL ALL</button>
                  </div>

                  <form [formGroup]="salarySlipForm">
                    <table class="table table-bordered">
                      <thead class="bg-secondary text-white">
                        <tr>
                          <th>S. No.</th>
                          <th>Month</th>
                          <th>Year</th>
                          <th>Message</th>
                        </tr>
                      </thead>
                      <tbody formArrayName="slips">
                        
                        <tr *ngFor="let slip of monthsFormArray.controls; let i = index" [formGroupName]="i">
                          <td class="text-center">{{ i + 1 }}</td>
                          <td>{{ slip.get('fk_monthId')?.value }}</td>
                          <td>{{ slip.get('fk_yearId')?.value }}</td>
                          <td><input type="text" class="form-control" formControlName="message"></td>
                        </tr>
                      </tbody>
                    </table>

                      <!-- Footer buttons -->
                      <div class="modal-footer">
                        <button type="submit"  class="btn btn-primary mx-1" (click)="submit()">Save</button>
                        <button type="button" class="btn btn-outline-dark mx-1">Reset</button>
                        <button type="button" class="btn btn-danger" >DELETE</button>
                      </div>
                  </form>


            </div>
        </div>
    </div>
</div>
