
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <div class="row w-100">
                  <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
                    <h4>List of Quarters</h4>
                   
                  </div>
                  <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
                    <button class="btn btnheader" routerLink="/dash/payroll/payrolldashboard/lockunlockflexihead">
                        Add
                      </button>
                  </div>
              
                  
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive table-invoice">
                    <table class="table table-bordered">
                        <thead>
                          <tr>
                            <th>Sr.</th>
                            <th>Financial Year</th>
                            <th>Quarter</th>
                            <th>End Dated</th>                        
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let lockunlockflexihead of LockunlockflexiheadList; let i = index">
                            <td>{{ i + 1 }}</td>
                            <td> {{lockunlockflexihead.FinancialYear}}</td>
                            <td>{{lockunlockflexihead.Quarter}}</td>
                            <td>{{lockunlockflexihead.EndDated}}</td>
                       
                            <td>
                                <button class="btn btn-sm btn-outline"   (click)="edit(lockunlockflexihead.id)"><i class="fa-regular fa-pen-to-square" style="color:#3080e8; font-size: 14px;"></i></button>
                              
                               <button class="btn btn-sm btn-outline"  (click)="delete(lockunlockflexihead.id)"><i class="fa fa-trash" style="color:#3080e8; font-size: 14px;"></i></button>
                              </td>
                          </tr> 
                        </tbody>
                      </table>
            
                    
                  </div>
            </div>

          
        </div>
    </div>
</div>
