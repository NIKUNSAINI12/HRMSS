<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
      <div class="card">
        
        <!-- Header -->
        <div class="card-header bg-primary py-lg-2 mt-0">
          <div class="row w-100 align-items-center">
            <div class="col-12 col-md-6">
              <h4 class="text-white text-center text-md-start">Tax configuration</h4>
            </div>
          </div>
        </div>
  
        <!-- Form Body -->
        <div class="card-body mt-2">
          <form [formGroup]="TaxConfirmationForm" class="row g-3">
  
            <!-- Row 1 -->
            <div class="row row-cols-1 row-cols-md-3 g-3">
              <div class="col">
                <label>Surcharge Qualifying Amount</label>
                <input type="text" class="form-control" formControlName="schargeQAmtLimit" />
              </div>
              <div class="col">
                <label>Surcharge Percentage</label>
                <input type="text" class="form-control" formControlName="sChargePer" />
              </div>
              <div class="col">
                <label>Edu. Cess Charge Percentage</label>
                <input type="text" class="form-control" formControlName="cessChargePer" />
              </div>
            </div>
  
            <!-- Row 2 -->
            <div class="row row-cols-1 row-cols-md-3 g-3">
              <div class="col">
                <label>Maximum 80C Deduction Limit</label>
                <input type="text" class="form-control" formControlName="max80DedLimit" />
              </div>
              <div class="col">
                <label>Maximum Child</label>
                <input type="text" class="form-control" formControlName="max_Child" />
              </div>
              <div class="col">
                <label>CEA Qualification Limit</label>
                <input type="text" class="form-control" formControlName="ceA_QLimit" />
              </div>
            </div>
  
            <!-- Row 3 -->
            <div class="row row-cols-1 row-cols-md-3 g-3">
              <div class="col">
                <label>Senior Citizen Age</label>
                <input type="text" class="form-control" formControlName="seniorcitizionage" />
              </div>
              <div class="col">
                <label>HRA Exempt For Metro (%)</label>
                <input type="text" class="form-control" formControlName="hraExemptMetroPer" />
              </div>
              <div class="col">
                <label>HRA Exempt For Non Metro (%)</label>
                <input type="text" class="form-control" formControlName="hraExemptNonMetroPer" />
              </div>
            </div>
  
            <!-- Row 4 -->
            <div class="row row-cols-1 row-cols-md-3 g-3">
              <div class="col">
                <label>Document Status Applicable</label>
                <ng-select [items]="docStatus" bindLabel="name" bindValue="value"
                           formControlName="docStatus" placeholder="--Select--" class="w-100"></ng-select>
              </div>
              <div class="col">
                <label>Document Submission Date</label>
                <input type="date" class="form-control" formControlName="documentSubmissionDate" />
              </div>
              <div class="col d-flex align-items-end justify-content-end">
                <button type="submit" class="btn btn-primary mx-1" (click)="update()">Update</button>
                <button type="button" class="btn btn-outline-dark mx-1" (click)="resetForm()">Reset</button>
              </div>
            </div>
  
          </form>
        </div>
      </div>
    </div>
  </div>
