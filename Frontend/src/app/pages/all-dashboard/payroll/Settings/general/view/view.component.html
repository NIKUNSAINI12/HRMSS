<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header bg-primary">
        <div class="row w-100 d-flex align-items-center justify-content-between">
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6">
            <h4 class="mb-0 text-white">Details</h4>
          </div>

          <div class="col-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader mx-2" [routerLink]="['/dash/user/userdashboard/general/list', codetypeId]"
              [queryParams]="{ codeType: codeType}">
              Back
            </button>
          </div>
        </div>
      </div>

      <div class="card-body" *ngIf="codeDetails;">
        <table class="table table-bordered">
          <tr>
            <th>Name</th>
            <td>{{ codeDetails.name }}</td>
          </tr>
          <tr>
            <th>Code</th>
            <td>{{ codeDetails.code }}</td>
          </tr>
          <tr>
            <th>Description</th>
            <td>{{ codeDetails.codeDescription }}</td>
          </tr>
          <tr>
            <th>Active</th>
            <td>
              <span class="badge"
                [ngClass]="{'bg-success': codeDetails.isActive, 'bg-secondary': !codeDetails.isActive}">
                {{ codeDetails.isActive ? 'Yes' : 'No' }}
              </span>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</div>
