
<div class="row">
    <div class="col-12">
      <div class="card">
        <!--  -->
          <div class="card-header">  
            <div class="row w-100">
              <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-between">
                <h4>List of Section Document Status</h4>
               
              </div>
              
              <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
                <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
              </div>
              <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-md-end">
                <button class="btn btnheader"  routerLink="/dash/payroll/payrolldashboard/Section-DocStatus">
                     Add
                  </button>
                  <button class="btn btn-light mx-1" (click)="exportToExcel()">
                    Download
                  </button>
              </div>
              
            </div>
        </div>
        <div class="card-body">
          <div class="row g-4">
            <div class="col-md-4">
              <label>Employee</label>
              <ng-select id="year"
                [items]="EmployeeList"
                bindLabel="name"
                bindValue="value"
                placeholder="--Select employee--"
                [(ngModel)]="fk_empid"
                (change)="onEmpidChange(fk_empid)"
                class="w-100">
              </ng-select>
            </div>
          </div>
        </div>
        <!--  -->
        <div class="card-body">
          <div class="table-responsive table-invoice">
            <table Id="exportTable"  class="table">
              <thead>
                <tr>
                  <th>Sr No.</th>
                  <th>Section Name</th>
                  <th>Sub Section Name</th>
                  <th>Status</th>
                  <th>Amount</th>
                  <th>Submit Dated</th>
                  <th>File</th>
                  <th>Action</th>
                </tr>
              </thead>
                <tbody>
                  <tr *ngFor=" let item of filteredData() | paginate : { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems: totalItems };let i = index">
                    <td>{{(pageIndex-1)* pageSize+i+1}}</td>
                    <td>{{item.secname}}</td>
                    <td>{{item.subsecname}}</td>
                     <td>{{item.docsub_status}}</td>
                    <td>{{item.docsub_Amt}}</td>
                    <td>{{item.submitdate}}</td>
                    <td>{{item.filename}}</td>
                    <td>
                    <button class="btn btn-sm btn-outline" (click)="edit(encryption.encryptText(item.pk_docid))"> <i class="fa-regular fa-pen-to-square"></i></button>
                     <button class="btn btn-sm btn-outline" (click)="delete(item.pk_docid)"><i class="fa fa-trash"></i> </button>
                    </td> 
                          </tr> 
               </tbody>
            
            </table>
  
             <!--for pagination-->
             <pagination-controls
             (pageChange)="onPageChange($event)"
             [responsive]="true">
           </pagination-controls>
         
                 <ng-template #noData>
                   <tr>
                     <td colspan="4" class="text-center">No data available</td>
                   </tr>
                 </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- message modal -->
