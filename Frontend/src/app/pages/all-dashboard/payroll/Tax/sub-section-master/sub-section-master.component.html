<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
            <!-- Card Header -->
            <div class="card-header bg-primary">
                <div class="row w-100">
                    <div class="col-sm-6 col-md-6 col-lg-6">
                        <h4 class="text-white">Subsection Master</h4>
                    </div>
                    <div class="col-sm-6 col-md-6 col-lg-6 d-flex align-items-center justify-content-end">
                        <button class="btn btn-light" (click)="view()">
                            Back
                        </button>
                    </div>
                </div>
            </div>

            <!-- Card Body -->
            <div class="card-body mt-4">
                <form [formGroup]="SubSectionForm" (ngSubmit)="onSubmit()" class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col">
                        <div class="form-group">
                            <label for="underSection">Under Section<span class="text-danger">*</span></label>
                            <ng-select [items]="Description" id="underSection"
                              bindLabel="name" bindValue="value" formControlName="fk_secid"
                              placeholder="--Select Under Section--" class="w-100">
                            </ng-select>
                            <span *ngIf="showError && SubSectionForm.controls['fk_secid'].invalid"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please select under section.
                            </span>
                        </div>
                    </div>

                    <div class="col">
                        <div class="form-group">
                            <label for="description">Description<span class="text-danger">*</span></label>
                            <input id="description" type="text" class="form-control flex-grow-1"
                                formControlName="description">
                            <div *ngIf="SubSectionForm.get('description')?.errors?.['duplicate']" class="text-danger"
                                style="font-size:10px;">
                                {{ SubSectionForm.get('description')?.errors?.['duplicate'] }}
                            </div>
                            <span
                                *ngIf="showError && SubSectionForm.controls['description'].invalid && !SubSectionForm.get('description')?.errors?.['duplicate']"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please enter subsection description.
                            </span>
                            <span *ngIf="SubSectionForm.get('description')?.hasError('maxlength')"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Maximum 100 characters allowed.
                            </span>
                        </div>
                    </div>

                    <div class="col">
                        <div class="form-group">
                            <label for="maxLimit">Max Limit<span class="text-danger">*</span></label>
                            <input id="maxLimit" type="number" class="form-control flex-grow-1"
                                formControlName="maxLimit">
                            <span *ngIf="showError && SubSectionForm.controls['maxLimit'].invalid"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please enter max limit.
                            </span>
                        </div>
                    </div>

                        <div class="form-group pt-md-4 mt-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="active" formControlName="active">
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                        </div>
                    
                    <div class="row w-100">
                        <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
                            <button type="submit" class="btn btn-outline-dark btn-sm mx-1 px-2">
                                {{ isEditMode ? 'Update' : 'Save' }}
                            </button>
                            <button type="button" class="btn btn-primary btn-sm mx-1 px-2"
                                (click)="resetForm()">Reset</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
