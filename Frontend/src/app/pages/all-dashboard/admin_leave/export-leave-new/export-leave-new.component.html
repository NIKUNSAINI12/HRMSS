<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
            <div class="card-header bg-primary py-lg-1 mt-0">
                <div class="row w-100 align-items-center">

                    <!-- Title Section -->
                    <div class="col-12 col-md-3">
                        <h4>Leave Report</h4>
                    </div>
                    <!-- Search Section -->
                    <div class="col-12 col-md-7 mt-2 mt-md-0">
                        <app-common-search (filtersChanged)="handleFilters($event)"></app-common-search>
                    </div>

                </div>
            </div>
            <div class="card-body mt-4">
                <form [formGroup]="ExportExcel" (ngSubmit)="OnVeiw()">
                    <div class="row row-cols-1 row-cols-md-4">

                        <div class="col">
                            <label>From Date</label>
                            <input type="date" formControlName="fromdate" class="form-control">
                            <span *ngIf="showErroronProcess && ExportExcel.controls['fromdate'].invalid"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please enter From Date.
                            </span>
                        </div>
                        <div class="col">
                            <label>To Date</label>
                            <div class="form-group">
                                <input type="date" formControlName="todate" class="form-control">
                                <span *ngIf="showErroronProcess && ExportExcel.controls['todate'].invalid"
                                    class="text-danger mt-1" style="font-size: 12px;">
                                    Please enter ToDate.
                                </span>
                            </div>
                        </div>
                        <div class="col" *ngIf="isContractApplicable">
                            <label>Contractor Name</label>

                            <div class="form-group">
                                <ng-select 
                                    [items]="CostCenter"
                                    bindLabel="name"
                                    bindValue="value"
                                    [multiple]="true"
                                    [closeOnSelect]="false"
                                    formControlName="fk_costcentreid" 
                                    placeholder="--Select --"
                                    class="w-100"
                                    (clear)="clearCostCenters()"
                                >
                                    <ng-template ng-multi-label-tmp>
                                        <span>{{ getCostCenterDisplayText() || '--Select --' }}</span>
                                    </ng-template>

                                    <ng-template ng-option-tmp let-item="item" let-index="index">
                                        <div *ngIf="item.value === '__select_all__'">
                                            <input type="checkbox" 
                                            (change)="toggleSelectAllCostCenters($event)" 
                                            [checked]="isAllCostCentersSelected()" 
                                            class="form-check-input fs-6 mx-1"/>
                                            <strong>Select All</strong>
                                        </div>
                                        <div *ngIf="item.value !== '__select_all__'">
                                            <input type="checkbox" 
                                            [checked]="selectedCostCenters.includes(item.value)"
                                            (change)="toggleCostCenter(item.value)" 
                                            class="form-check-input fs-6 mx-1"/>
                                            {{ item.name }}
                                        </div>
                                    </ng-template>
                                </ng-select>
                            </div>
                        </div>
                        <div class="col">
                            <label>Leave Type</label>
                            <ng-select id="leavetype" [items]="leavetypeddl" bindLabel="name" bindValue="value"
                                formControlName="fk_leaveid" placeholder="--Select leavetype --"
                                class="w-100"></ng-select>
                        </div>
                        <div class="col">
                            <label>Export Type <span class="text-danger font-bold">*</span></label>
                            <div class="form-group">
                                <ng-select id="ExportType" [items]="ExportTypelist" bindLabel="name" bindValue="value"
                                    formControlName="ExportType" placeholder="--Select --" class="w-100"></ng-select>
                                <span *ngIf="showError && ExportExcel.controls['ExportType'].invalid"
                                    class="text-danger mt-1" style="font-size: 12px;">
                                    Please enter ExportType.
                                </span>
                            </div>
                        </div>

                        <div class="col-lg-12 d-flex align-items-center justify-content-end">
                            <button type="submit" class="btn btn-primary mx-1">View</button>
                            <button type="reset" class="btn btn-outline-dark mx-1" (click)="restfrom()">Reset</button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- List of Employee -->
            <div *ngIf="showEmployeeList">
                <div class="row row-cols-1 row-cols-md-2 p-2 align-items-center">
                    <div class="col">
                        <p class="text-dark m-0 ps-3 text-primary">
                            List of Employee
                            <span class="badge bg-primary  ms-2">{{ totalItems }} records</span>
                        </p>
                    </div>

                    <div class="col d-flex align-items-center justify-content-end gap-2">
                        <button class="btn btn-primary mx-1" (click)="downloadExcel()" [disabled]="isExporting">
                            <i *ngIf="!isExporting" class="fa fa-download me-2"></i>
                            <i *ngIf="isExporting" class="fa fa-spinner fa-spin me-2"></i>
                            {{ isExporting ? 'Wait...' : 'Export Excel' }}
                        </button>
                        <!-- Search box — filters current page, then falls back to server -->
                        <input type="text" class="form-control w-50" placeholder="Search..." [(ngModel)]="searchText"
                            (ngModelChange)="onSearchTextChanged()" />
                    </div>

                </div>


                <div class="table-responsive table-invoice" [ngClass]="{ 'scroll-active': EmployeeList.length > 10 }">
                    <table class="table table-bordered" id="exportTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th *ngFor="let col of tableHeaders">{{ col }}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                                *ngFor="let item of filteredData() | paginate: { itemsPerPage: pageSize, currentPage: pageIndex, totalItems: totalItems }; let i = index">
                                <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                                <td *ngFor="let col of tableHeaders">{{ item[col] }}</td>
                            </tr>
                            <tr *ngIf="filteredData().length === 0">
                                <td [attr.colspan]="tableHeaders.length + 1" class="text-center text-muted py-3">
                                    No records found.
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination controls -->
                    <pagination-controls (pageChange)="onPageChange($event)"></pagination-controls>
                </div>
            </div>
        </div>
    </div>

</div>
