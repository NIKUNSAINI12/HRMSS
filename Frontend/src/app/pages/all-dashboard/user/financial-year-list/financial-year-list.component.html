
<div class="row">
    <div class="col-12">
        <div class="card">
          <!-- heading -->
          <div class="card-header bg-blue">
            <div class="row w-100">
              <!-- Title Section -->
              <div class="col-sm-12 col-md-6 col-lg-4 d-flex align-items-center justify-content-start">
                <h4 class="text-white">List Of Payroll Financial Year</h4>
              </div>
              <div class="col-sm-12 col-md-6 col-lg-4 d-flex align-items-center justify-content-center">
                <input type="text" class="form-control" placeholder="Search..."  />
              </div>
              <!-- Back Button -->
              <div class="col-sm-12 col-md-6 col-lg-4 d-flex align-items-center justify-content-end ms-auto gap-2">
                <button class="btn btn-light" routerLink="/dash/user/userdashboard/financialYear">
                  Add
                </button>
                
              </div>
            </div>
          </div>



            <div class="card-body">
                <div class="table-responsive table-invoice">
                    <table class="table table-bordered">
                        <thead>
                          <tr>
                            <th>Sr.</th>
                            <th>From Date</th>
                            <th>To Date</th>
                            <th>Active</th>
                            <th>Action</th>
                            
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let item of fincancialList | paginate: { itemsPerPage: pageSize, currentPage: pageIndex ,totalItems:totalItems};let i = index">
                            <td>{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                            <td>{{ item.date1 }}</td>
                            <td>{{ item.date2 }}</td>
                            <td>{{ item.active }}</td>
                            <td>
                                <button class="btn btn-sm btn-outline" (click)="isUpdate(item.pk_finid)" ><i class="fa-regular fa-pen-to-square"></i></button>
                              
                               <button class="btn btn-sm btn-outline" (click)="delete(item.pk_finid)" ><i class="fa fa-trash"></i></button>
                              </td>
                          </tr> 
                        </tbody>
                      </table>
            
                    
                  </div>
            </div>

                <!-- Header: Change Financial Year -->
      <div class="card-header bg-blue mt-4">
        <div class="row w-100">
          <div class="col-md-6">
            <h4>Change Financial Year</h4>
          </div>
        </div>
      </div>

      <!-- Change Year Radio Section -->
      <div class="card-body">
        <form [formGroup]="changeFYForm">
          <div class="row">
            <div class="col-md-12">
              <ul class="list-unstyled">
                <li *ngFor="let fy of financialYears; let i = index" class="mb-2">
                  <input 
                    type="radio" 
                    class="form-check-input fs-6 mx-1" 
                    [value]="fy.pk_finid" 
                    formControlName="selectedFinancialYear"
                    name="financialYear">
                  <span style="font-size: 13px;">{{fy.fyear}}</span>
                </li>
              </ul>
            </div>
          </div>
        </form>
      </div>

      <!-- Change Button -->
      <div class="modal-footer">
        <button type="button" class="btn btn-primary mx-1" (click)="onChangeFinancialYear()">Change</button>
      </div>
        </div>
    </div>
</div>
