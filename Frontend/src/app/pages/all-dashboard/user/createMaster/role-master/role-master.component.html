<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">
 
  <!--  -->
  <div class="card-header bg-blue ">
    <div class="row w-100 ">
  <div class="col-sm-12 col-md-6 col-lg-6  "> 
      <h4 class="">
          {{ Isedit? 'Update Roles Master':'Roles Master'}}</h4></div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
              <button class="btn btnheader" routerLink="/dash/user/userdashboard/roleMaster_list">Back
                </button>
            </div>

</div>

</div>
   
  <!--  -->

  <div class="card-body mt-4">
    <form [formGroup]="UserDetails"class="row row-cols-1 row-cols-md-3">
     
     
          
          <div class="col"><label>Description<span style="color: red;">*</span></label>
              <div class="form-group">
                  <input  type="text" class="form-control flex-grow-1" formControlName="rolename"  (blur)="checkAvailability(UserDetails.get('rolename')?.value)">
                  <!-- <span *ngIf="showError && UserDetails.controls['rolename'].invalid && !UserDetails.get('locname')?.errors?.['duplicate']" class="text-danger mt-1" style="font-size: 12px;">
                    Please enter Description.
                  </span>
                <div *ngIf="UserDetails.get('rolename')?.errors?.['duplicate']" 
                class="text-danger" style="font-size:10px;">
                {{ UserDetails.get('rolename')?.errors?.['duplicate'] }}
               </div> -->


<!-- Validation message below input field -->
<span *ngIf="showError && UserDetails.controls['rolename'].invalid && !UserDetails.get('rolename')?.errors?.['duplicate']" class="text-danger mt-1" style="font-size: 12px;">
Please enter description.
</span> 
          <!-- Show validation error message from API only if it exists -->
<div *ngIf="UserDetails.get('rolename')?.errors?.['duplicate']" 
 class="text-danger" style="font-size:10px;">
      {{ UserDetails.get('rolename')?.errors?.['duplicate'] }}
</div>


              </div>                
          </div> 
          <div class="col"><label>Role Alias<span style="color: red;">*</span></label>
              <div class="form-group">
                  <input  type="text" class="form-control flex-grow-1" formControlName="mappedalias" (blur)="checkAliasAvailability(UserDetails.get('mappedalias')?.value)">
                  <span *ngIf="showError && UserDetails.controls['mappedalias'].invalid && !UserDetails.get('mappedalias')?.errors?.['duplicate']" class="text-danger mt-1" style="font-size: 12px;">
                    Please enter Role Alias.
                  </span>
                  <div *ngIf="UserDetails.get('mappedalias')?.errors?.['duplicate']" 
                  class="text-danger" style="font-size:10px;">
                  {{ UserDetails.get('mappedalias')?.errors?.['duplicate'] }}
              </div>
              </div>                
          </div>
          <div class="col">
              <label>Role Level<span style="color: red;">*</span></label>
         
              <div class="form-group">
                <ng-select id="year" [items]="rolelevel" bindLabel="name" bindValue="value"
                formControlName="rolelevel" placeholder="--Select --"
                class="w-100"></ng-select>
                <span *ngIf="showError && UserDetails.controls['rolelevel'].invalid" class="text-danger mt-1" style="font-size: 12px;">
                  Please enter Role Level.
                </span>
              </div>  
          </div>
          <div class="col">
              <label>Remarks</label>
              <div class="form-group">
                  <textarea class="form-control"formControlName="remarks"></textarea>
              </div>
          </div>
    </form>
    <div class="row">
      <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
     
         <button type="submit" class="btn btn-primary  mx-1"(click)="onSubmit()">{{ Isedit ? 'Update' : 'Save' }}</button>     
         <button type="button" class="btn btn-outline-dark mx-1"(click)="resetForm()">Reset</button>
                        
      </div>
  </div>
  </div>

 
 

    
</div>
</div>
</div>
