<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header bg-primary">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-4 d-flex align-items-center justify-content-start">
            <h4 class="text-white">External Recruitment Dashboard</h4>
          </div>
        </div>
      </div>

      <div class="card-body">
        <div class="row">
          
          <!-- Naukri Stats -->
          <div class="col-md-3">
            <div class="card mb-3">
              <div class="card-body text-center p-3">
                <h6 class="text-muted text-uppercase mb-1">Naukri.com</h6>
                <div class="mb-2">
                  <span class="fs-5 text-info fw-bold">{{ totalNaukriJobs }}</span> <span class="text-muted">Jobs</span>
                </div>
                <div>
                  <span class="fs-5 text-info fw-bold">{{ totalNaukriCandidates }}</span> <span class="text-muted">Candidates</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Indeed Stats -->
          <div class="col-md-3">
            <div class="card mb-3">
              <div class="card-body text-center p-3">
                <h6 class="text-muted text-uppercase mb-1">Indeed</h6>
                <div class="mb-2">
                  <span class="fs-5 text-success fw-bold">{{ totalIndeedJobs }}</span> <span class="text-muted">Jobs</span>
                </div>
                <div>
                  <span class="fs-5 text-success fw-bold">{{ totalIndeedCandidates }}</span> <span class="text-muted">Candidates</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Cards -->
          <div class="col-md-3">
            <div class="card mb-3 h-100">
              <div class="card-body d-flex align-items-center justify-content-center p-3">
                <button class="btn btn-outline-primary w-100" routerLink="/dash/recruitment/recruitmentdashboard/jobMaster_list">View All Jobs</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
