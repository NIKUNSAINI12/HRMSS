
<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
      <div class="card">
 <!--  -->
  <div class="card-header bg-blue ">
    <div class="row w-100 ">
  <div class="col-sm-12 col-md-6 col-lg-6  m-0 p-0" > 
      <h4 class="">
    
      {{ Isedit ? 'Update Recruitment Mode Master'  : 'Recruitment Mode Master' }} </h4></div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
              <button class="btn btnheader" routerLink="/dash/recruitment/recruitmentdashboard/recruitmentMode-master_list">Back
                </button>
            </div>
</div>
</div>
   
  <!--  -->

  <div class="card-body mt-4">

    <form class="row row-cols-1 row-cols-md-3" [formGroup]="recruitModeDetails">
            
        <div class="col">
            <label>Type<span style="color: red;">*</span></label>
          <div class="form-group">
              <ng-select id="type" 
              [items]="selects" bindLabel="name" bindValue="value"
              formControlName="type"
              placeholder="--Select --"
              class="w-100"></ng-select>
              <span class="text-danger mt-1" style="font-size: 12px;"*ngIf="submitted && recruitModeDetails.controls['type'].invalid">
                Please enter type.
              </span>
            </div>  
        </div>
        <div class="col"><label>Name<span style="color: red;">*</span></label>
            <div class="form-group">
                <input  type="text" class="form-control flex-grow-1" formControlName="name" (blur)="checkAvailability(recruitModeDetails.get('name')?.value)">
                
<span *ngIf="submitted && recruitModeDetails.controls['name'].invalid && !recruitModeDetails.get('name')?.errors?.['duplicate']" class="text-danger mt-1" style="font-size: 12px;">
  Please enter name.
</span> 
            <!-- Show validation error message from API only if it exists -->
 <div *ngIf="recruitModeDetails.get('name')?.errors?.['duplicate']" 
   class="text-danger" style="font-size:10px;">
        {{ recruitModeDetails.get('name')?.errors?.['duplicate'] }}
  </div>
            </div>                
        </div>   
       
        <div class="col"><label>Is Active </label>
            <div class="form-group">
                  <input  type="checkbox" formControlName="isActive">
               
            </div>                
        </div>   
        <div class="col"><label>Description</label>
          <div class="form-group">
          
              <textarea class="form-control flex-grow-1" formControlName="description"></textarea>
             
          </div>                
      </div> 
        <!-- <div class="row">
            <div class="col d-flex align-items-end justify-content-end align-content-center">
              <button type="submit" class="btn btn-primary btn-sm mx-1 px-2" (click)="submitForm()">{{ Isedit ? 'Update' : 'Save' }}</button>

                <button type="reset" class="btn btn-outline-dark btn-sm mx-1 px-2" (click)="Onreset()">Reset</button>
                
            </div>
        </div> -->

           <!-- Footer buttons -->
           <div class="col"></div>

           <div class="col d-flex align-items-center justify-content-md-end">
            <button type="submit" class="btn btn-primary mx-1" (click)="submitForm()">{{ Isedit ? 'Update' : 'Save' }}</button>

            <button type="reset" class="btn btn-outline-dark mx-1" (click)="Onreset()">Reset</button>
            
           </div>
           
    </form></div>
</div>
</div>
</div>
