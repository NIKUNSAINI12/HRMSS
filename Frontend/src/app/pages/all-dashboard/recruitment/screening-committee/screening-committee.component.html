<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
            <!-- card header  -->
            <div class="card-header bg-primary py-lg-1 mt-0">
                <div class="row w-100 align-items-center">

                    <!-- Title Section -->
                    <div class="col-12 col-md-4">
                        <h4>{{ Isedit ? 'Update Screening Committee' : 'Screening Committee' }}</h4>
                    </div>

                    <!-- Search Section -->
                    <div class="col-12 col-md-6 mt-2 mt-md-0">
                        <app-common-search (filtersChanged)="handleFilters($event)"></app-common-search>
                    </div>

                    <!-- Button Section -->
                    <div class="col-12 col-md-2 mt-2 mt-md-0 d-flex justify-content-center justify-content-md-end">
                        <button class="btn btnheader"
                            routerLink="/dash/recruitment/recruitmentdashboard/ScreeningCommittee-list">
                            Back
                        </button>
                    </div>

                </div>
            </div>
            <!--  -->

            <div class="card-body mt-4 p-0">

                <form class="row row-cols-1 row-cols-md-3" [formGroup]="ScreeningCommittee">

                    <div class="col">
                        <label>Job Details <span style="color: red;">*</span></label>
                        <div class="form-group">
                            <ng-select id="Member" [items]="jobList" bindLabel="name" bindValue="value"
                                formControlName="fk_jobId" placeholder="--Select --" class="w-100"></ng-select>
                            <div *ngIf="showerror   && ScreeningCommittee.get('fk_jobId')?.invalid"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please choose Job
                            </div>
                        </div>

                    </div>

                    <div class="col"><label>Remark</label>
                        <div class="form-group">

                            <input type="text" class="form-control flex-grow-1" formControlName="remarks" />

                        </div>
                    </div>



                </form>

                <div class="page-seperator bg-primary mx-2 rounded-1">
                    <p class="text-white ms-4 p-1">Internal Member Details</p>
                </div>

                <form  [formGroup]="ScreeningCommittee">
               <div class="row row-cols-1 row-cols-md-3">
                    <div class="col">
                        <label>Member <span style="color: red;">*</span></label>
                        <div class="form-group">
                            <ng-select id="Member" [items]="EmployeeList" bindLabel="name" bindValue="value"
                                formControlName="fk_empid" placeholder="--Select --" class="w-100"></ng-select>
                            <div *ngIf="showerror   && ScreeningCommittee.get('fk_empid')?.invalid"
                                class="text-danger mt-1" style="font-size: 12px;">
                                Please choose Member
                            </div>
                        </div>

                    </div>

                    <div class="col align-content-center pb-2 pb-lg-0">
                        <button type="button" class="btn btn-primary mx-1" (click)="addMember()">Add</button>

                        <button type="reset" class="btn btn-outline-dark mx-1" (click)="Onreset()">Reset</button>
                    </div>
             </div>
               



                <div class="table-responsive table-invoice">
                    <table class="table table-bordered">
                        <thead>

                            <tr>
                                <th>Sr.No</th>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>DELETE</th>
                            </tr>

                        </thead>
                        <tbody>
                            <tr *ngFor="let member of selectedMembers; let i = index">
                                <td>{{ i + 1 }}</td>
                                <td>{{ member.empCode }}</td>
                                <td>{{ member.empName }}</td>
                                <td>{{ member.department }}</td>
                                <td>{{ member.designation }}</td>
                                <td>
                                    <i class="fa-solid fa-trash text-danger cursor-pointer"
                                        (click)="removeMember(i)"></i>
                                </td>
                            </tr>
                        </tbody>
                    </table>


                </div>

                <!-- Footer buttons -->



                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary mx-1" (click)="submitForm()">{{ Isedit ? 'Update' : 'Save' }}</button>

                    <button type="reset" class="btn btn-outline-dark mx-1" (click)="Onreset()">Reset</button>
                </div>


                 </form>

            </div>
        </div>
    </div>
</div>
