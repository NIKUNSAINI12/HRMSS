<div class="row">
    <div class="col-sm-12 col-md-12 col-lg-12">
      <div class="card">
   
    <!--  -->
    <div class="card-header bg-blue ">
      <div class="row w-100 ">
    <div class="col-sm-12 col-md-6 col-lg-6  "> 
        <h4 class="">
            {{ isedit ? 'Update External Members For The Recruitment Committee' : 'External Members For The Recruitment Committee' }}  </h4></div>
            <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
                <button class="btn btnheader" routerLink="/dash/recruitment/recruitmentdashboard/externalMember_list">Back
                  </button>
              </div>

</div>

</div>
     
    <!--  -->

    <div class="card-body mt-4">
      <form [formGroup]="externalMemberDetails" class="row row-cols-1 row-cols-md-3">
       
       
            <div class="col"><label>Member Name<span style="color: red;">*</span></label>
                <div class="form-group">
                    <input  type="text" class="form-control flex-grow-1" formControlName="member_name">
                    <span  class="text-danger mt-1" style="font-size: 12px;" *ngIf="showerror && externalMemberDetails.controls['member_name'].invalid">
                      Please enter memeber name.
                    </span>
                </div>                
            </div>
            <div class="col"><label>Department<span style="color: red;">*</span></label>
                <div class="form-group">
                    <input  type="text" class="form-control flex-grow-1" formControlName="department">
                    <span  class="text-danger mt-1" style="font-size: 12px;" *ngIf="showerror && externalMemberDetails.controls['department'].invalid">
                      Please enter Department.
                    </span>
                </div>                
            </div> 
            <div class="col"><label>Designation<span style="color: red;">*</span></label>
                <div class="form-group">
                    <input  type="text" class="form-control flex-grow-1" formControlName="designation">
                    <span  class="text-danger mt-1" style="font-size: 12px;" *ngIf="showerror && externalMemberDetails.controls['designation'].invalid">
                      Please enter Designation.
                    </span>
                </div>                
            </div> 
            
            <div class="col"><label>Address</label>
                <div class="form-group">
                    <input  type="text" class="form-control flex-grow-1" formControlName="address">
                    
                </div>                
            </div> 
            <div class="col"><label>Phone No.</label>
                <div class="form-group">
                    <input  type="text" class="form-control flex-grow-1" formControlName="phone" (keypress)="validateNumber($event)" maxlength="10">
                </div>                
            </div>  
            <div class="col"><label>Alternate Phone No.</label>
                <div class="form-group">
                    <input  type="text" class="form-control flex-grow-1" formControlName="mobile"  (keypress)="validateNumber($event)" maxlength="10">
                </div>                
            </div>    
            <div class="col"><label>Email Id</label>
                <div class="form-group">
                    <input  type="email" class="form-control flex-grow-1" formControlName="email">
                </div>                
            </div>  
            <div class="col"><label>Remarks</label>
                <div class="form-group">
                    <textarea class="form-control flex-grow-1" formControlName="remarks"></textarea>
                   
                </div>                
            </div>  
      </form>
      <div class="row">
        <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
            <button type="button" class="btn btn-primary mx-1" (click)="onSubmit()">{{ isedit ? 'Update' : 'Save' }}</button>                   
      
            <button type="button" class="btn btn-outline-dark mx-1" (click)="onReset()">Reset</button>
             </div>
    </div>
    </div>

   
   

      
</div>
</div>
</div>
