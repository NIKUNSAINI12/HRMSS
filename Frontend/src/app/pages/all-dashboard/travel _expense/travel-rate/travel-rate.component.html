<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">

      <!-- Card Header -->
      <div class="card-header bg-blue">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6">
            <h4>   {{ isEditMode ? 'Update Travel Rate Master' : 'Travel Rate Master' }}</h4>
          </div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/travel_expense/travel_expensedashboard/Travel_rate_list">
              Back
            </button>
          </div>
        </div>
      </div>

      <!-- Card Body -->
      <div class="card-body mt-4">
        <form [formGroup]="TravelRateform" class="row row-cols-1 row-cols-md-3 g-4">

          <div class="col">
            <div class="form-group">
              <label>Travel Mode<span style="color: red;">*</span></label>
              <ng-select [items]="Modelist" bindLabel="name" bindValue="value"
                formControlName="fk_travelmodeId" placeholder="--Select --" class="w-100">
              </ng-select>
              <div *ngIf="submitted && TravelRateform.get('fk_travelmodeId')?.invalid"
                class="text-danger mt-1" style="font-size: 12px;">
                 please choose Travel Mode.
              </div>
            </div>
          </div>
            <div class="col">
            <div class="form-group">
              <label>Rate/Km<span style="color: red;">*</span></label>
              <input type="number" class="form-control" formControlName="rate">
              <div *ngIf="submitted && TravelRateform.get('rate')?.invalid"
                class="text-danger mt-1" style="font-size: 12px;">
                please enter Rate/Km.
              </div>
            </div>
          </div>

          
               <div class="col">
            <div class="form-group">
              <label>Effective Date<span style="color: red;">*</span></label>
              <input type="date" class="form-control" formControlName="effectivedate">
              <div *ngIf="submitted && TravelRateform.get('effectivedate')?.invalid"
                class="text-danger mt-1" style="font-size: 12px;">
                please enter Date .
              </div>
            </div>
          </div>

        
        

              <div class="col">
            <div class="form-group">
              <label>Remark<span style="color: red;">*</span></label>
           
              <textarea type="text" class="form-control" formControlName="remarks"></textarea>
              <div *ngIf="submitted && TravelRateform.get('remarks')?.invalid"
                class="text-danger mt-1" style="font-size: 12px;">
                please enter Remark.
              </div>
            </div>
          </div>
         <div class="col">
                            <label for="isactive" >Active</label>
                            <div class="form-group">
                                <input type="checkbox" id="isactive" formControlName="isActive" class="form-check-input" />

                            </div>
                        </div>
        </form>

        <div class="row">
          <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
            <button type="submit" class="btn btn-primary btn-sm mx-1 px-2" (click)="submit()">
             {{ isEditMode ? 'Update' : 'Save' }}   
            </button>
            <button type="button" class="btn btn-outline-dark btn-sm mx-1 px-2" (click)="resetForm()">
              Reset
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
