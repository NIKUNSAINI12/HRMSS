<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-header bg-primary">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
            <h4>
              {{Isedit? 'Update Travel Class Master':'Travel Class Master'}}
            </h4>
          </div>
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader"
              routerLink="/dash/travel_expense/travel_expensedashboard/travelClassMaster_list">
              Back
            </button>
          </div>

        </div>
      </div>

      <div class="card-body mt-3">
        <form [formGroup]="travelClassForm">
          <!-- Department Name -->
          <div class="row" class="row row-cols-1 row-cols-md-4 g-4">

            <div class="col">
              <label for="class">Class<span style="color: red;">*</span></label>
              <div class="form-group">
                <input type="text" class="form-control" formControlName="classname" maxlength="150"
                  (blur)="checkDesignationAvailability(travelClassForm.get('classname')?.value)" />
                <div *ngIf="ShowError  && travelClassForm.get('classname')?.invalid && !travelClassForm.get('classname')?.errors?.['duplicate']" class="text-danger mt-1"
                  style="font-size: 12px;">
                  Please Enter Class
                </div>
                <!-- Show validation error message from API only if it exists -->
                <div *ngIf="travelClassForm.get('classname')?.errors?.['duplicate']" class="text-danger"
                  style="font-size:10px;">
                  {{ travelClassForm.get('classname')?.errors?.['duplicate'] }}
                </div>

              </div>
            </div>


            <div class="col">
              <label for="remarks">Remarks<span style="color: red;">*</span></label>
              <div class="form-group">
                <textarea type="text" formControlName="remarks" class="form-control" maxlength="500"></textarea>
                <div *ngIf="ShowError  && travelClassForm.get('remarks')?.invalid" class="text-danger mt-1"
                  style="font-size: 12px;">

                  Please Enter Remarks
                </div>
              </div>
            </div>

            <div class="col">
              <label for="isactive">Active</label>
              <div class="form-group">
                <input type="checkbox" id="isActive" formControlName="isActive" class="form-check-input" />

              </div>
            </div>

            <!-- Footer buttons -->
            <div class="col">
              <div class="d-flex justify-align-center justify-content=md-end">
                <button type="submit" class="btn btn-primary mx-1 " (click)="onSubmit()"> {{Isedit?
                  'Update':'Save'}}</button>
                <button type="button" class="btn btn-outline-dark mx-1 " (click)="onReset()">Reset</button>

              </div>
            </div>



          </div>



        </form>
      </div>
    </div>
  </div>
</div>
