<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header">
        <h4>Reset Password</h4>
      </div>
      <div class="card-body mt-4">
        <div class="row">
          <!-- Image Column -->
          <div class="col-sm-12 col-md-6 d-flex align-items-center justify-content-center">
            <img src="assets/Image/Security On-amico (1).png" alt="Password Reset" class="img-fluid">
          </div>

          <!-- Form Column -->
          <div class="col-sm-12 col-md-6 align-items-center">
            <!-- Form Starts -->
            <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="row g-3">
              <p class="text-muted">Please enter your old password and set a new one to reset your password.</p>
              
              <!-- Old Password -->
              <div class="col-sm-12">
                <label class="ps-2" for="oldPassword">Old Password</label>
                <div class="input-group">
                  <div class="input-group-text"><i class="fa-solid fa-lock"></i></div>
                  <input
                    [type]="showOldPassword ? 'text' : 'password'"
                    class="form-control"
                    id="oldPassword"
                    placeholder="Old Password"
                     (blur)="verifyOldPassword()"
                    formControlName="oldPassword"
                     [class.is-invalid]="oldPasswordError">
                  <span
                    class="input-group-text p-3 password-toggle"
                    style="cursor: pointer;"
                    (click)="showOldPassword = !showOldPassword">
                    <i [class]="showOldPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
                  </span>
                </div>
                

                <!-- Show validation errors -->
  <div *ngIf="submitted && validate['oldPassword'].errors" class="text-danger">
    <div *ngIf="validate['oldPassword'].errors['required']">Password is required.</div>
  </div>
  
  <!-- Show old password verification error -->
  <div *ngIf="oldPasswordError" class="text-danger">
    {{oldPasswordError}}
  </div>
              </div>



              <!-- New Password -->
              <div class="col-sm-12">
                <label class="ps-2" for="newPassword">New Password</label>
                <div class="input-group">
                  <div class="input-group-text"><i class="fa-solid fa-lock"></i></div>
                  <input
                    [type]="showNewPassword ? 'text' : 'password'"
                    class="form-control"
                    id="newPassword"
                    placeholder="New Password"
                    formControlName="NewPassword">
                  <span
                    class="input-group-text p-3 password-toggle"
                    style="cursor: pointer;"
                    (click)="showNewPassword = !showNewPassword">
                    <i [class]="showNewPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
                  </span>
                </div>

                <div *ngIf="submitted && validate['NewPassword'].errors" class="text-danger">
                  <div *ngIf="validate['NewPassword'].errors['required']">New password is required.</div>
                  </div>
              </div>

              <!-- Confirm Password -->

              <div class="col-sm-12">
                <label class="ps-2" for="confirmPassword">Confirm Password</label>
                <div class="input-group">
                  <div class="input-group-text"><i class="fa-solid fa-lock"></i></div>
                  <input
                    [type]="showConfirmPassword ? 'text' : 'password'"
                    class="form-control"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    formControlName="confirmPassword">
                  <span
                    class="input-group-text p-3 password-toggle"
                    style="cursor: pointer;"
                    (click)="showConfirmPassword = !showConfirmPassword">
                    <i [class]="showConfirmPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
                  </span>
                </div>
                <div *ngIf="submitted && validate['confirmPassword'].errors" class="text-danger">
                  <div *ngIf="validate['confirmPassword'].errors['required']">Confirmation password is required.</div>
                  <div *ngIf="validate['confirmPassword'].errors['mismatch']">Passwords do not match.</div>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="col-sm-12">
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
              </div>
            </form>
            <!-- Form Ends -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
