


    



<div class="row m-0">
  <div class="col-12 px-0 py-0">
    <div class="card px-0 m-0">





      <div class="card-header">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
            <h4 class="mb-0">{{ caption }} </h4>

            <div class="dropdown d-flex align-items-center justify-content-center d-md-none">
              <button class="btn bg-transparent text-white px-0 mt-1" type="button" id="dropdownMenuButton"
                data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-solid fa-bars fs-6"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">

                <li *ngIf="showAddButton"><a class="dropdown-item" routerLink="/dash/leaves/leavesdashboard/shortleaverequest"> Add</a></li>
                <!-- <li><a class="dropdown-item">Download PDF</a></li> -->
              </ul>
            </div>
          </div>


          <div class="col-12 col-md-3 all-pickup-point-search-header d-flex align-items-center justify-content-md-end">
            <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
          </div>


          <div class="col-12 col-md-3 d-flex justify-content-md-end align-items-center mt-md-0">
            <div class="d-none d-md-flex">
              <button *ngIf="showAddButton" class="btn btnheader mx-2" routerLink="/dash/leaves/leavesdashboard/shortleaverequest"> Add</button>
              <!-- <button class="btn btnheader"><i class="fa-solid fa-file-arrow-down"></i>&nbsp;PDF</button> -->
            </div>
          </div>
        </div>
      </div>







      <div class="card-body px-0  m-2">
        <!-- table-responsive-md makes the full table scrollable ONLY above md breakpoint -->
        <div class="table-responsive-md">
          <table Id="exportTable" class="table">
            <thead>
              <tr>
               <th>S.No.</th>
                                <th>Request Date</th>
                                <th>Leave Date</th>
                                <th>Time From</th>
                                <th>Time To</th>
                                <th>Total Hours</th>
                                <th>Remarks</th>
                                <th>Status</th>
                                 <th>Action</th>
              </tr>
            </thead>
            <tbody>



              <tr
                *ngFor="let request of filteredData();let i = index">
                <td data-label="Sr.No. : ">{{ i + 1 }}</td>
                <td data-label="Request Date : ">{{ request.dated }}</td>
                <td data-label="Leave Date : ">{{ request.shortLeavedate }}</td>
                <td data-label="From Time : ">{{ request.intime }}</td>
                <td data-label="To Time : ">{{ request.outtime }}</td>
                <td data-label="Total hrs: ">{{ request.totalhours }}</td>
                           
                <td data-label="Remarks: ">{{ request.remarks }}</td>
                <td data-label="Status: "  [ngClass]="{
      'text-success  btn-success': request.status === 'Approved',
      'text-warning btn-warning': request.status === 'Pending',
      'text-danger btn-danger': request.status === 'Rejected',
    }">
                 
                  {{ request.status }}</td>


                <td class="pt-1 pb-0 m-0 d-flex align-items-center justify-content-center">
                                  

                                               <button class="btn btn-sm btn-outline"  data-label="Action: "*ngIf="request.status === 'Pending'" (click)="onDeleteShortLeave(request.pk_shortLeaveId)"> <i
                      class="fa fa-trash"></i></button>
                                </td>

              </tr>

            </tbody>
          </table>
          <!-- Pagination controls -->
      
        </div>
      </div>


    </div>
  </div>
</div>
