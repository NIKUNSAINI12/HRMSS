
<!--  -->

<div class="row m-0">
    <div class="col-12 px-0 py-0">
        <div class="card px-0 m-0">


   <div class="card-header">
                <div class="row w-100">
                    <div
                        class="col-sm-12 col-md-6 col-lg-6 col-xxl-6 d-flex align-items-center justify-content-between">
                        <h4 class="mb-0">List of HR Policy</h4>

                        <div class="dropdown d-flex align-items-center justify-content-center d-md-none">
                            <button class="btn bg-transparent text-white px-0 mt-1" type="button"
                                id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fa-solid fa-bars fs-6"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">

                                <!-- <li><a class="dropdown-item">Add</a></li> -->
                                <!-- <li><a class="dropdown-item">PDF</a></li> -->
                            </ul>
                        </div>
                    </div>


                    <div
                        class="col-12 col-md-3 all-pickup-point-search-header d-flex align-items-center justify-content-md-end">
                        <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText" />
                    </div>


                    <div class="col-12 col-md-3 d-flex justify-content-end align-items-center mt-md-0">
                        <div class="d-none d-md-flex">
                            <!-- <button class="btn btnheader mx-2">+ Add</button> -->
                            <!-- <button class="btn btnheader"><i class="fa-solid fa-file-arrow-down"></i>&nbsp;Download</button>-->
                        </div> 
                    </div>
                </div>
            </div>






            <div class="card-body px-0  m-2">
                <!-- table-responsive-md makes the full table scrollable ONLY above md breakpoint -->
                <div class="table-responsive-md">
                    <table Id="exportTable" class="table">
                        <thead>
                            <tr>
                             



                                 <th>Sr.No.</th>
                                <th>Description</th>
                                <th>Date</th>
                                <th>Department</th>
                                <th>File</th>


                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of filteredData() | paginate: { itemsPerPage: pageSize, currentPage: pageIndex, totalItems: totalItems }; let i = index">
                                <td data-label="Sr.No. : ">{{ (pageIndex - 1) * pageSize + i + 1 }}</td>
                                <td data-label="Description: ">{{ item.description }}</td>
                                <td data-label="Date : ">{{ item.dated | date:'dd MMM yyyy'}}</td>
                                <td data-label="Department: ">{{ item.department }}</td>
                                 
                                <!-- <td data-label="File name : " class="lh-sm" >{{ item.filename }}</td> -->

                                   <td data-label="File: " class="lh-sm" (click)="item.filename ?download(item.filename) : null" style="cursor: pointer; text-align: center;">
                <i *ngIf="item.filename" class="fas fa-file-pdf text-danger" aria-hidden="true" title="View/Download file"></i>
              </td>

                            


                                <!-- <td class="pt-1 pb-0 m-0 d-flex align-items-center justify-content-center">
                                    <button class="btn btn-sm btn-outline px-1 mx-1 pt-1 pb-0 my-0"><i
                                            class="fa-regular fa-pen-to-square fw-semibold"></i></button>
                                    <button class="btn btn-sm btn-outline px-1 mx-1 pt-1 pb-0 my-0"><i
                                            class="fa fa-trash text-dark"></i></button>
                                </td> -->

                            </tr>

                        </tbody>
                    </table>
                       <pagination-controls (pageChange)="onPageChange($event)"></pagination-controls>
                </div>
            </div>
        </div>
    </div>
</div>
