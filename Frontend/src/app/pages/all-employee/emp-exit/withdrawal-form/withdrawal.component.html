<div class="card">

    <!-- Header -->
  
    <div class="card-header bg-primary py-3">
  
      <div class="d-flex justify-content-between align-items-center">
  
        <h4 class="text-white mb-0">
          Withdrawal Request
        </h4>
  
        <button
          class="btn btnheader"
          routerLink="/dash/emp-exit/emp-exitdashboard/resignation_list">
  
          Back
  
        </button>
  
      </div>
  
    </div>
  
    <!-- Body -->
  
    <div class="card-body">
  
      <form [formGroup]="withdrawalForm">
  
        <!-- Employee Details -->
  
        <div class="row">
  
          <div class="col-md-4 mb-3">
  
            <label class="form-label">
              Resignation Date
            </label>
  
            <input
              type="date"
              class="form-control"
              formControlName="resignationDate"
              readonly>
  
          </div>
  
          <div class="col-md-4 mb-3">
  
            <label class="form-label">
              Expected Last Working Day
            </label>
  
            <input
              type="date"
              class="form-control"
              formControlName="expectedLWD"
              readonly>
  
          </div>
  
          <div class="col-md-4 mb-3">
  
            <label class="form-label">
              Notice Period (Days)
            </label>
  
            <input
              type="text"
              class="form-control"
              formControlName="noticePeriod"
              readonly>
  
          </div>
  
        </div>
  
        <div class="row">
  
          <div class="col-md-4 mb-3">
  
            <label class="form-label">
              Notice Period Served
            </label>
  
            <input
              type="text"
              class="form-control"
              [value]="withdrawalForm.get('isNoticePeriodServed')?.value ? 'Yes' : 'No'"
              readonly>
  
          </div>
  
          <div class="col-md-4 mb-3">
  
            <label class="form-label">
              Reason
            </label>
  
            <input
              type="text"
              class="form-control"
              formControlName="reason"
              readonly>
  
          </div>
  
          <div class="col-md-4 mb-3">
  
            <label class="form-label">
              Employee Remarks
            </label>
  
            <textarea
              rows="3"
              class="form-control"
              formControlName="remarks"
              readonly>
            </textarea>
  
          </div>
  
        </div>
  
        <!-- Withdrawal Section -->
  
        <div class="page-seperator bg-primary rounded-1 mt-3">
          <p class="text-white ms-3 p-2 mb-0">
            Withdrawal Action
          </p>
        </div>
  
        <div class="row mt-3">
  
          <div class="col-md-4">
  
            <label>
              Withdrawal Status
              <span class="text-danger">*</span>
            </label>
  
            <ng-select
              [items]="withdrawStatusList"
              bindLabel="name"
              bindValue="id"
              formControlName="status"
              placeholder="--Select--">
  
            </ng-select>
  
            <span
              *ngIf="submitted && withdrawalForm.get('status')?.invalid"
              class="text-danger"
              style="font-size:12px;">
  
              Please select Withdrawal Status.
  
            </span>
  
          </div>
  
          <div class="col-md-8">
  
            <label>
              Withdrawal Remarks
              <span class="text-danger">*</span>
            </label>
  
            <textarea
              class="form-control"
              rows="1"
              formControlName="withdrawalRemarks"
              placeholder="Enter Withdrawal Remarks">
            </textarea>
  
            <span
              *ngIf="submitted && withdrawalForm.get('withdrawalRemarks')?.invalid"
              class="text-danger"
              style="font-size:12px;">
  
              Please enter Withdrawal Remarks.
  
            </span>
  
          </div>
  
        </div>
  
        <!-- Buttons -->
  
        <div class="col-12 d-flex justify-content-end mt-4">
  
          <button
            type="button"
            class="btn btn-primary mx-1"
            (click)="submit()">
  
            Submit
  
          </button>
  
          <button
            type="button"
            class="btn btn-outline-dark mx-1"
            (click)="reset()">
  
            Reset
  
          </button>
  
        </div>
  
      </form>
  
    </div>
  
  </div>
