<div class="row">
  <div class="col-sm-12 col-md-12 col-lg-12">
    <div class="card">
      <div class="card-header bg-blue">
        <div class="row w-100">
          <div class="col-sm-12 col-md-6 col-lg-6">
            <h4>Asset Return Form</h4>
          </div>
          <div class="col-sm-12 col-md-6 col-lg-6 d-flex align-items-center justify-content-md-end">
            <button class="btn btnheader" routerLink="/dash/emp-exit/emp-exitdashboard/resignation_list">Back</button>
          </div>
        </div>
      </div>
      <div class="card-body mt-4">

        <!-- Employee Info -->
        <div class="row row-cols-1 row-cols-md-3 mb-4">
          <div class="col"><label>Employee Code</label>
            <div class="form-group"><input type="text" class="form-control flex-grow-1" [value]="empInfo.empCode" readonly></div>
          </div>
          <div class="col"><label>Employee Name</label>
            <div class="form-group"><input type="text" class="form-control flex-grow-1" [value]="empInfo.empName" readonly></div>
          </div>
          <div class="col"><label>Last Working Day</label>
            <div class="form-group"><input type="text" class="form-control flex-grow-1" [value]="empInfo.lwd" readonly></div>
          </div>
        </div>

        <div class="bg-primary rounded-1 page-seperator mb-3">
          <p class="p-1 text-white ms-4 mb-0">Asset Details</p>
        </div>

        <form [formGroup]="assetForm">
          <div class="table-responsive table-invoice">
            <table class="table">
              <thead>
                <tr>
                  <th style="width:40px">#</th>
                  <th>Asset</th>
                  <th style="width:130px">Issued?</th>
                  <th style="width:170px">Status</th>
                  <th style="width:150px">Recovery (₹)</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody formArrayName="assets">
                <tr *ngFor="let asset of assets.controls; let i = index" [formGroupName]="i">
                  <td>{{ i + 1 }}</td>
                  <td class="align-middle fw-semibold">{{ getGroup(i).get('name')?.value }}</td>

                  <!-- Issued? -->
                  <td>
                    <ng-select
                      [items]="issuedOptions"
                      bindLabel="name"
                      bindValue="value"
                      formControlName="issued"
                      [clearable]="false"
                      class="w-100">
                    </ng-select>
                  </td>

                  <!-- Status -->
                  <td>
                    <ng-select
                      [items]="statusOptions"
                      bindLabel="name"
                      bindValue="value"
                      formControlName="status"
                      [clearable]="false"
                      placeholder="--Select--"
                      [disabled]="!isIssued(i)"
                      class="w-100">
                    </ng-select>
                  </td>

                  <!-- Recovery Amount -->
                  <td>
                    <input type="number" class="form-control form-control-sm"
                      formControlName="recoveryAmount"
                      [attr.disabled]="!isRecoverable(i) ? true : null"
                      placeholder="0">
                  </td>

                  <!-- Remarks -->
                  <td>
                    <input type="text" class="form-control form-control-sm"
                      formControlName="remarks" placeholder="Remarks">
                  </td>
                </tr>
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="4" class="text-end fw-bold">Total Recovery Amount:</td>
                  <td class="fw-bold">₹ {{ totalRecovery() }}</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </form>

        <!-- Buttons -->
        <div class="row">
          <div class="col d-flex align-items-end justify-content-end pt-4 pb-3">
            <button type="submit" class="btn btn-primary mx-1" (click)="submitForm()">Submit</button>
            <button type="button" class="btn btn-outline-dark mx-1" (click)="assetForm.reset()">Reset</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
