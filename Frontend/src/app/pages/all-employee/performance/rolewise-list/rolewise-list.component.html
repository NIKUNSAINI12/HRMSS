
<div class="row">
    <div class="col-12">
      <div class="card">
        
          <div class="card-header bg-blue py-lg-1 mt-0">
            <div class="col-sm-12 col-md-12 col-lg-3 col-12">
          
                <div class="row w-100">
                    <div class="col-sm-12 col-md-12 col-lg-12 ">
                        <h4 class="">Rolewise KRA List</h4>
                    </div>
                </div>
          
            </div>
          
            <div class="col-sm-12 col-md-12 col-lg-7 col-12">
                <div class="row w-100">
                    <div class="col-sm-12 col-md-8 col-lg-8">
                        <!-- <app-common-search  [(ngModel)]="searchText"(filtersChanged)="handleFilters($event)"></app-common-search> -->
                    </div>
                    <div class="col-sm-12 col-md-4 col-lg-4 col-xxl-4 d-flex align-items-center justify-content-center">
                      <input type="text" class="form-control"placeholder="Search..."  [(ngModel)]="searchText" />
                    </div>
                </div>
            </div>
            <div class="col-sm-12 col-md-12 col-lg-2 col-12">
            <div class="col-sm-12 col-md-4 col-lg-12  d-flex align-items-center justify-content-md-end">
              <button class="btn btnheader" routerLink="/dash/appraisal/appraisaldashboard/Rolewise-KRA">
                   Add
                </button>
                <!-- <button class="btn btn-light mx-1" (click)="exportToExcel()">
                  Download
                </button> -->
            </div>
            </div>
          </div>
          <!--  -->
         

          <div class="card-body">
            <div class="table-responsive table-invoice">
              <table Id="exportTable"  class="table">
                <thead>
                  <tr>
                    <th>Sr.No.</th>
                    <th>Role</th>
                    <!-- <th></th> -->
                    <th>Total KRA(s)</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>

                  <tr *ngFor="let item of RolewiseList;let i = index">

                    <td>{{i+1}}</td>
                     <td>{{item.roleName }}</td> 
                    <!-- <td>{{ item.kra }}</td> -->
                    <td>{{ item.total_Trn_Records}}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" (click)="update(item.roleId,i+1)">
                            <i class="fa-regular fa-pen-to-square" ></i>
                          </button>

                        <button class="btn btn-sm btn-outline" (click)="delete(item.roleId,i+1)">
                        <i class="fa fa-trash"></i>
                        </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
