<div class="row">
    <div class="col-xl-12">
        <div class="card custom-card border-0">
            <div class="container">
                <div class="text-center p-5">
                    <div class="row align-items-center justify-content-center" style="min-height: 70vh;">
                        <div class="col-xl-6 col-lg-8">
                            
                            <!-- 404 Number -->
                            <h1 class="display-1 fw-bold text-primary mb-4" style="font-size: 140px; line-height: 1;">
                                404
                            </h1>

                            <!-- Message -->
                            <h3 class="fw-semibold mb-3">Page Not Found</h3>
                            <p class="text-muted fs-16 mb-5">
                                The page you're looking for doesn't exist.
                            </p>

                            <!-- Button -->
                            <a (click)="navigateToAnotherComponent()" class="btn btn-primary btn-lg px-5 py-3 shadow-sm">
                                <i class="ri-arrow-left-line me-2"></i>
                                Back to Home
                            </a>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
