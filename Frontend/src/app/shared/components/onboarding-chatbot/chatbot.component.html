<div class="chatbot-container" *ngIf="isOpen">
  <div class="chatbot-backdrop" (click)="toggleChat()"></div>
  <div class="chatbot-modal teams-layout">
    <!-- Full Width Chat Area -->
    <div class="teams-chat-area">
      <div class="chatbot-header">
        <div class="d-flex align-items-center">
          <div class="bot-avatar-header me-3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg></div>
          <div>
            <h6 class="mb-0 fw-bold text-dark">HR Assistant</h6>

          </div>
        </div>
        <button class="btn-close" (click)="toggleChat()"></button>
      </div>

      <div class="chatbot-messages" #scrollMe>
        <div *ngFor="let msg of messages" [ngClass]="{'msg-bot': msg.sender === 'bot', 'msg-user': msg.sender === 'user'}">
          <div class="msg-bubble shadow-sm">
            {{ msg.text }}
          </div>
          <div class="msg-time">{{ msg.timestamp | date:'shortTime' }}</div>
        </div>
        <div class="typing-indicator" *ngIf="isTyping">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="chatbot-input">
        <input type="text" 
               [(ngModel)]="newMessage" 
               (keyup.enter)="sendMessage()" 
               placeholder="Type your message here..."
               class="form-control teams-input shadow-sm">
        <button class="btn btn-primary ms-3 rounded-circle teams-send-btn shadow-sm" (click)="sendMessage()" [disabled]="!newMessage.trim() || isTyping">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<button class="chatbot-toggle" (click)="toggleChat()" *ngIf="!isOpen">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
    <circle cx="12" cy="5" r="2"></circle>
    <path d="M12 7v4"></path>
    <line x1="8" y1="16" x2="8.01" y2="16"></line>
    <line x1="16" y1="16" x2="16.01" y2="16"></line>
  </svg>
</button>
